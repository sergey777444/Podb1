<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>📘 Grammar Notes</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📘</text></svg>">
<style>
:root{--bg:#f6f4ff;--card:#fff;--ink:#1b1f3b;--soft:#5b6088;--line:#1b1f3b;--yel:#ffd84d;--green:#1f9d63;--ok-bg:#e6f7ee;--blue:#3b6cff;--blue-s:#e8eeff;--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12142a;--card:#1b1e3a;--ink:#eceeff;--soft:#a3a8d6;--line:#5a609a;--ok-bg:#16352a;--blue-s:#1c2650}}
:root[data-theme="dark"]{--bg:#12142a;--card:#1b1e3a;--ink:#eceeff;--soft:#a3a8d6;--line:#5a609a;--ok-bg:#16352a;--blue-s:#1c2650}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
.hero{padding:18px 0 6px}
.badge{display:inline-block;padding:4px 12px;border:2px solid var(--line);border-radius:999px;background:var(--yel);color:#1b1f3b;font-weight:800;font-size:13px}
h1{font:italic 800 32px/1.15 var(--serif);margin:12px 0 6px}
h1 span{background:var(--yel);color:#1b1f3b;padding:0 8px;border-radius:8px}
.hero p{margin:0;color:var(--soft)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 -4px 12px;padding:8px 4px;background:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:none;padding:8px 14px;border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:700 14px var(--sans);cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.qs{display:none}.qs.on{display:block}
h2.sec{font:italic 800 24px/1.25 var(--serif);margin:8px 0 14px}
.box{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.box h3{margin:0 0 8px;font:italic 800 18px var(--serif)}
.box p{margin:0 0 10px}.box p:last-child,.box ul:last-child{margin-bottom:0}
.box ul{margin:6px 0 10px;padding-left:20px}.box li{margin-bottom:6px}
.main{background:var(--ok-bg);border-color:var(--green)}.main h3{color:var(--green)}
.k{background:var(--yel);color:#1b1f3b;padding:0 5px;border-radius:5px;font-weight:700}
.ex{margin:10px 0;padding:11px 13px;border:2px dashed var(--line);border-radius:12px;color:var(--soft);font-size:14px}
.ex strong{color:var(--ink)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1.5px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
th{background:var(--blue-s)}
.step{display:flex;gap:10px;align-items:flex-start;margin-bottom:6px}
.step .n{flex:none;width:28px;height:28px;display:grid;place-items:center;border:2px solid var(--line);border-radius:50%;background:var(--yel);color:#1b1f3b;font-weight:800;font-size:14px}
.step>div{flex:1;min-width:0}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
  <span class="badge">📘 Practical Grammar
