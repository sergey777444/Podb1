<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script src="app.js?v=3"></script>
<title>📚 Дневник ДЗ — ФЛ1-ПОДб-11</title>
<script>
  if (localStorage.getItem('user-theme') === 'light') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', 'dark');
</script>
<style>
:root{--bg:#080b14;--bg2:#0e1320;--card:rgba(19,25,40,.78);--card-h:rgba(25,32,51,.9);--text:#f4f7ff;--text2:#aeb8cc;--muted:#78839a;--border:rgba(255,255,255,.09);--accent:#7c6cff;--accent3:#8b5cf6;--danger:#ff6878;--shadow:0 20px 70px rgba(0,0,0,.35);--rl:20px;--rm:14px}
[data-theme="light"]{--bg:#f3f6fb;--bg2:#fff;--card:rgba(255,255,255,.84);--card-h:rgba(255,255,255,.98);--text:#172033;--text2:#5d687b;--muted:#7c8799;--border:rgba(20,30,50,.09);--accent:#6557e8;--accent3:#7848dc;--shadow:0 20px 60px rgba(40,50,80,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(124,108,255,.17),transparent 28%),radial-gradient(circle at 90% 20%,rgba(69,202,255,.12),transparent 25%),var(--bg);padding:20px 10px 60px}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.container{width:min(900px,calc(100% - 32px));margin:0 auto}
.hero{padding:34px;margin-bottom:24px;border:1px solid var(--border);border-radius:28px;background:linear-gradient(135deg,rgba(124,108,255,.14),rgba(69,202,255,.05) 45%,var(--card));box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.badge{display:inline-flex;padding:7px 12px;border-radius:999px;background:rgba(124,108,255,.13);border:1px solid rgba(124,108,255,.24);color:#bdb6ff;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
[data-theme="light"] .badge{color:#5c50c9}
.hero h1{font-size:clamp(22px,4vw,32px);letter-spacing:-.03em}
.theme-btn{height:48px;padding:0 16px;border:1px solid var(--border);border-radius:14px;color:var(--text);background:rgba(255,255,255,.05);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.date-box,.admin-box{border:1px solid var(--border);border-radius:var(--rl);padding:24px;margin-bottom:24px;background:var(--card);box-shadow:var(--shadow)}
.date-box{text-align:center}
.date-box label,.form-group label{display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.form-control{width:min(280px,100%);padding:12px 14px;font-size:14px;border:1px solid var(--border);border-radius:var(--rm);background:rgba(255,255,255,.035);color:var(--text);outline:none;text-align:center}
.form-control:focus{border-color:rgba(124,108,255,.65)}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1)}
[data-theme="light"] input[type=date]::-webkit-calendar-picker-indicator{filter:none}
.week-info{font-size:13px;font-weight:800;color:var(--accent);margin-top:12px;text-transform:uppercase;letter-spacing:.05em}
.status-bar{text-align:center;font-size:12px;color:var(--muted);margin-bottom:16px;font-weight:600}
.pairs-grid{display:grid;gap:16px;margin-bottom:28px}
.pair-card{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--accent);border-radius:var(--rl);padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.pair-card.lecture-card{border-left-color:var(--accent3);background:linear-gradient(135deg,rgba(139,92,246,.08),var(--card))}
.pair-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:10px}
.pair-title{font-size:16px;font-weight:800}
.pair-num{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--accent);background:rgba(124,108,255,.12);padding:4px 10px;border-radius:8px;border:1px solid rgba(124,108,255,.25);white-space:nowrap}
.lecture-badge{display:inline-block;background:rgba(139,92,246,.15);color:#d8b4fe;font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;margin-bottom:8px;border:1px solid rgba(139,92,246,.25)}
.hw-text{font-size:13px;line-height:1.6;color:var(--text2);white-space:pre-line;word-break:break-word}
.no-hw{color:var(--muted);font-style:italic}
.admin-toggle-box{text-align:center;margin-bottom:24px}
.btn-toggle{background:rgba(255,255,255,.045);border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:var(--rm);font-size:13px;font-weight:700}
.admin-box{display:none}
.admin-box h4{margin-bottom:16px;font-size:16px}
.form-group{margin-bottom:14px}
select.form-control,textarea.form-control{width:100%;text-align:left}
textarea.form-control{resize:vertical;min-height:90px}
select.form-control option{background:var(--bg2);color:var(--text)}
.btn-group{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:16px}
@media(max-width:600px){.btn-group{grid-template-columns:1fr}}
.btn-save{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;border:none;padding:12px;border-radius:var(--rm);font-weight:700;font-size:13px}
.btn-delete{background:rgba(255,104,120,.15);border:1px solid rgba(255,104,120,.35);color:var(--danger);padding:12px;border-radius:var(--rm);font-weight:700;font-size:13px}
</style>
</head>
<body>
<div class="container">
  <header class="hero">
    <div>
      <div class="badge">🎓 ФЛ1 • ПОДб-11</div>
      <h1>📚 Дневник домашнего задания</h1>
    </div>
    <button class="theme-btn" onclick="toggleTheme()"><span id="themeIcon">☀️</span><span id="themeText">Светлая</span></button>
  </header>

  <div class="date-box">
    <label for="dateSelect">Выберите дату занятий</label>
    <input type="date" id="dateSelect" class="form-control" onchange="renderSchedule()">
    <div class="week-info" id="weekInfo">Загрузка...</div>
  </div>

  <div class="status-bar" id="statusBar"></div>
  <div class="pairs-grid" id="scheduleContainer"></div>

  <div class="admin-toggle-box">
    <button class="btn-toggle" onclick="toggleAdmin()">⚙️ Редактировать ДЗ / Лекции на эту дату</button>
  </div>

  <div class="admin-box" id="adminBox">
    <h4>📝 Редактирование задания</h4>
    <div class="form-group">
      <label for="subjectSelect">Пара</label>
      <select id="subjectSelect" class="form-control"></select>
    </div>
    <div class="form-group">
      <label for="hwInput">Текст задания / Заметка к лекции</label>
      <textarea id="hwInput" class="form-control" placeholder="Введите текст задания..."></textarea>
    </div>
    <div class="btn-group">
      <button class="btn-save" onclick="saveHW()">Сохранить задание</button>
      <button class="btn-delete" onclick="deleteHW()">Удалить ДЗ</button>
    </div>
  </div>
</div>

<script>
  /* Запросы к этому адресу перехватывает app.js и отправляет в Supabase */
  const API_URL = "https://api.npoint.io/ac41837c39a8785f2ce4";

  const schedule = {
    odd: {
      1: [[2, "Английский грамматика"], [3, "Английский говорение"], [4, "Английский говорение"]],
      2: [[1, "История России", true], [2, "ТМК", true], [3, "СТПОИ"]],
      3: [[2, "Физра"], [3, "ОРГ"]],
      4: [[2, "Латынь"], [3, "Китайский Ван"], [4, "ТМК"], [5, "СТПОИ", true]],
      5: [[1, "Китайский Циберная"], [2, "Английский грамматика"], [3, "Английский фонетика"]]
    },
    even: {
      1: [[1, "История России"], [2, "Английский грамматика"], [3, "Английский говорение"], [4, "Английский говорение"]],
      2: [[1, "ОРГ", true], [2, "ТМК", true], [3, "Технологии цифрового образования", true]],
      3: [[2, "Физра"], [3, "ОРГ"]],
      4: [[2, "Латынь"], [3, "Китайский Ван"], [4, "ТМК"], [5, "ОБЖ"]],
      5: [[1, "Китайский Циберная"], [2, "Английский грамматика"], [3, "Английский фонетика"]]
    }
  };

  let hwDatabase = {};
  const html = document.documentElement;

  function applyTheme(theme) {
    const icon = document.getElementById("themeIcon"), text = document.getElementById("themeText");
    if (theme === 'light') { html.removeAttribute('data-theme'); icon.textContent = "🌙"; text.textContent = "Тёмная"; }
    else { html.setAttribute('data-theme', 'dark'); icon.textContent = "☀️"; text.textContent = "Светлая"; }
  }
  function toggleTheme() {
    const t = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('user-theme', t); applyTheme(t);
  }
  applyTheme(localStorage.getItem('user-theme') || 'dark');

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function getWeekType(d) {
    const anchorMonday = new Date(2026, 8, 14); // 14.09.2026 = нечётная
    const target = new Date(d);
    const day = target.getDay();
    const diffToMonday = target.getDate() - (day === 0 ? 6 : day - 1);
    const targetMonday = new Date(target.setDate(diffToMonday));
    const diffWeeks = Math.round((targetMonday - anchorMonday) / (1000 * 60 * 60 * 24 * 7));
    return Math.abs(diffWeeks) % 2 === 0 ? 'odd' : 'even';
  }

  async function loadHWFromCloud() {
    const status = document.getElementById('statusBar');
    status.innerText = 'Загрузка ДЗ...';
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('Ошибка сети');
      hwDatabase = await res.json() || {};
      status.innerText = '';
    } catch (e) {
      console.error(e);
      status.innerText = '❌ Ошибка подключения к базе';
    }
    renderSchedule();
  }

  async function syncToCloud() {
    const status = document.getElementById('statusBar');
    status.innerText = 'Сохранение...';
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(hwDatabase)
      });
      if (!res.ok) throw new Error('Ошибка сохранения');
      status.innerText = '✅ Изменения сохранены!';
      setTimeout(() => { status.innerText = ''; }, 2500);
    } catch (e) {
      console.error(e);
      status.innerText = '❌ Ошибка сохранения (нужны права админа)';
    }
  }

  function renderSchedule() {
    const dateInput = document.getElementById('dateSelect').value;
    if (!dateInput) return;
    const p = dateInput.split('-');
    const selectedDate = new Date(p[0], p[1] - 1, p[2]);
    const dayOfWeek = selectedDate.getDay();
    const weekType = getWeekType(selectedDate);

    const container = document.getElementById('scheduleContainer');
    const subjectSelect = document.getElementById('subjectSelect');
    const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
    document.getElementById('weekInfo').innerText = `${days[dayOfWeek]} • ${weekType === 'odd' ? 'Нечётная неделя' : 'Чётная неделя'}`;

    container.innerHTML = '';
    subjectSelect.innerHTML = '';

    if (dayOfWeek === 0 || dayOfWeek === 6) {
      container.innerHTML = '<div class="pair-card" style="text-align:center;color:var(--muted)">В этот день нет занятий! 🎉</div>';
      return;
    }

    const pairs = schedule[weekType][dayOfWeek] || [];
    pairs.forEach(([num, title, isLecture]) => {
      const opt = document.createElement('option');
      opt.value = title;
      opt.innerText = `${num}-я пара: ${title}${isLecture ? ' (Лекция)' : ''}`;
      subjectSelect.appendChild(opt);

      const hw = hwDatabase[`${dateInput}_${title}`];
      const card = document.createElement('div');
      card.className = isLecture ? 'pair-card lecture-card' : 'pair-card';
      card.innerHTML = `
        <div class="pair-header"><div class="pair-title">${title}</div><span class="pair-num">${num}-я пара</span></div>
        ${isLecture ? '<div class="lecture-badge">📚 Лекция</div>' : ''}
        ${hw ? `<div class="hw-text">${esc(hw)}</div>` : '<div class="hw-text no-hw">Нет задания</div>'}`;
      container.appendChild(card);
    });
  }

  async function saveHW() {
    const date = document.getElementById('dateSelect').value;
    const subj = document.getElementById('subjectSelect').value;
    const text = document.getElementById('hwInput').value.trim();
    if (!text || !subj) { alert('Выберите предмет и введите текст задания!'); return; }
    hwDatabase[`${date}_${subj}`] = text;
    document.getElementById('hwInput').value = '';
    renderSchedule();
    await syncToCloud();
  }

  async function deleteHW() {
    const date = document.getElementById('dateSelect').value;
    const subj = document.getElementById('subjectSelect').value;
    const key = `${date}_${subj}`;
    if (!hwDatabase[key]) { alert('Для этой пары и так нет сохранённого задания.'); return; }
    if (!confirm(`Удалить домашнее задание по предмету "${subj}"?`)) return;
    delete hwDatabase[key];
    renderSchedule();
    await syncToCloud();
  }

  function toggleAdmin() {
    const box = document.getElementById('adminBox');
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
  }

  window.onload = function () {
    const n = new Date();
    document.getElementById('dateSelect').value =
      `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
    loadHWFromCloud();
  };
</script>
</body>
</html>
