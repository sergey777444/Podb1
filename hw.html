<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Дневник ДЗ — ФЛ1-ПОДб-11</title>
<link rel="stylesheet" href="theme.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script src="app.js?v=13"></script>
<style>
.date-box{text-align:center}
.date-box .form-control{width:min(280px,100%);text-align:center}
.week-info{margin-top:12px;color:var(--red);font:800 13px var(--sans);letter-spacing:.05em;text-transform:uppercase}
.pairs-grid{display:grid;gap:14px;margin:18px 0 26px}
.pair-card{padding:16px 18px;background:var(--card);border:2px solid var(--line);border-left:10px solid var(--blue);border-radius:var(--r);box-shadow:var(--sh)}
.pair-card.lecture-card{border-left-color:var(--red)}
.pair-header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.pair-title{font:italic 800 18px var(--serif)}
.pair-num{padding:2px 9px;border:2px solid var(--line);border-radius:8px;background:var(--yel);color:#1b1f3b;font:800 11px var(--sans);text-transform:uppercase;white-space:nowrap}
.lecture-badge{display:inline-block;margin-bottom:8px;padding:2px 9px;border:2px solid var(--line);border-radius:6px;background:var(--red);color:#fff;font:800 11px var(--sans)}
.hw-text{color:var(--soft);font-size:14px;line-height:1.6;white-space:pre-line;word-break:break-word}
.hw-text:not(.no-hw){color:var(--ink)}
.no-hw{font-style:italic}
.admin-toggle-box{text-align:center;margin-bottom:20px}
.admin-box{display:none}
.admin-box h4{margin-bottom:14px;font:italic 800 19px var(--serif)}
.btn-group{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-top:16px}
@media(max-width:600px){.btn-group{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
  <header class="hero">
    <span class="badge">🎓 ФЛ1 • ПОДб-11</span>
    <h1>Дневник <span class="hl">ДЗ</span></h1>
    <p>Домашние задания по датам занятий</p>
  </header>

  <div class="box date-box">
    <label class="lbl" for="dateSelect">Выберите дату занятий</label>
    <input type="date" id="dateSelect" class="form-control" onchange="renderSchedule()">
    <div class="week-info" id="weekInfo">Загрузка...</div>
  </div>

  <div class="status" id="statusBar"></div>
  <div class="pairs-grid" id="scheduleContainer"></div>

  <div class="admin-toggle-box">
    <button class="btn ghost btn-toggle" onclick="toggleAdmin()">⚙️ Редактировать ДЗ / Лекции на эту дату</button>
  </div>

  <div class="box admin-box" id="adminBox">
    <h4>📝 Редактирование задания</h4>
    <div class="form-group">
      <label for="subjectSelect">Пара</label>
      <select id="subjectSelect" class="form-control"></select>
    </div>
    <div class="form-group">
      <label for="hwInput">Текст задания / Заметка к лекции</label>
      <textarea id="hwInput" class="form-control" placeholder="Введите текст задания..."></textarea>
    </div>
    <div class="btn-group">
      <button class="btn" onclick="saveHW()">Сохранить задание</button>
      <button class="btn danger" onclick="deleteHW()">Удалить ДЗ</button>
    </div>
  </div>
</div>

<script>
  /* Запросы к этому адресу перехватывает app.js и отправляет в Supabase */
  const API_URL = "https://api.npoint.io/ac41837c39a8785f2ce4";

  const schedule = {
    odd: {
      1: [[2, "Английский грамматика"], [3, "Английский говорение"], [4, "Английский говорение"]],
      2: [[1, "История России", true], [2, "ТМК", true], [3, "СТПОИ"]],
      3: [[2, "Физра"], [3, "ОРГ"]],
      4: [[2, "Латынь"], [3, "Китайский Ван"], [4, "ТМК"], [5, "СТПОИ", true]],
      5: [[1, "Китайский Циберная"], [2, "Английский грамматика"], [3, "Английский фонетика"]]
    },
    even: {
      1: [[1, "История России"], [2, "Английский грамматика"], [3, "Английский говорение"], [4, "Английский говорение"]],
      2: [[1, "ОРГ", true], [2, "ТМК", true], [3, "Технологии цифрового образования", true]],
      3: [[2, "Физра"], [3, "ОРГ"]],
      4: [[2, "Латынь"], [3, "Китайский Ван"], [4, "ТМК"], [5, "ОБЖ"]],
      5: [[1, "Китайский Циберная"], [2, "Английский грамматика"], [3, "Английский фонетика"]]
    }
  };

  let hwDatabase = {};

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function getWeekType(d) {
    const anchorMonday = new Date(2026, 8, 14); // 14.09.2026 = нечётная
    const target = new Date(d);
    const day = target.getDay();
    const diffToMonday = target.getDate() - (day === 0 ? 6 : day - 1);
    const targetMonday = new Date(target.setDate(diffToMonday));
    const diffWeeks = Math.round((targetMonday - anchorMonday) / (1000 * 60 * 60 * 24 * 7));
    return Math.abs(diffWeeks) % 2 === 0 ? 'odd' : 'even';
  }

  async function loadHWFromCloud() {
    const status = document.getElementById('statusBar');
    status.innerText = 'Загрузка ДЗ...';
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('Ошибка сети');
      hwDatabase = await res.json() || {};
      status.innerText = '';
    } catch (e) {
      console.error(e);
      status.innerText = '❌ Ошибка подключения к базе';
    }
    renderSchedule();
  }

  async function syncToCloud() {
    const status = document.getElementById('statusBar');
    status.innerText = 'Сохранение...';
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify(hwDatabase)
      });
      if (!res.ok) throw new Error('Ошибка сохранения');
      status.innerText = '✅ Изменения сохранены!';
      setTimeout(() => { status.innerText = ''; }, 2500);
    } catch (e) {
      console.error(e);
      status.innerText = '❌ Ошибка сохранения';
    }
  }

  function renderSchedule() {
    const dateInput = document.getElementById('dateSelect').value;
    if (!dateInput) return;
    const p = dateInput.split('-');
    const selectedDate = new Date(p[0], p[1] - 1, p[2]);
    const dayOfWeek = selectedDate.getDay();
    const weekType = getWeekType(selectedDate);

    const container = document.getElementById('scheduleContainer');
    const subjectSelect = document.getElementById('subjectSelect');
    const days = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
    document.getElementById('weekInfo').innerText = `${days[dayOfWeek]} • ${weekType === 'odd' ? 'Нечётная неделя' : 'Чётная неделя'}`;

    container.innerHTML = '';
    subjectSelect.innerHTML = '';

    if (dayOfWeek === 0 || dayOfWeek === 6) {
      container.innerHTML = '<div class="pair-card" style="text-align:center;color:var(--soft)">В этот день нет занятий! 🎉</div>';
      return;
    }

    const pairs = schedule[weekType][dayOfWeek] || [];
    pairs.forEach(([num, title, isLecture]) => {
      const opt = document.createElement('option');
      opt.value = title;
      opt.innerText = `${num}-я пара: ${title}${isLecture ? ' (Лекция)' : ''}`;
      subjectSelect.appendChild(opt);

      const hw = hwDatabase[`${dateInput}_${title}`];
      const card = document.createElement('div');
      card.className = isLecture ? 'pair-card lecture-card' : 'pair-card';
      card.innerHTML = `
        <div class="pair-header"><div class="pair-title">${title}</div><span class="pair-num">${num}-я пара</span></div>
        ${isLecture ? '<div class="lecture-badge">📚 Лекция</div>' : ''}
        ${hw ? `<div class="hw-text">${esc(hw)}</div>` : '<div class="hw-text no-hw">Нет задания</div>'}`;
      container.appendChild(card);
    });
  }

  async function saveHW() {
    if (window.isGuest || !window.isAdmin) {
      alert('Редактирование ДЗ доступно только администраторам.');
      return;
    }
    const date = document.getElementById('dateSelect').value;
    const subj = document.getElementById('subjectSelect').value;
    const text = document.getElementById('hwInput').value.trim();
    if (!text || !subj) { alert('Выберите предмет и введите текст задания!'); return; }
    hwDatabase[`${date}_${subj}`] = text;
    document.getElementById('hwInput').value = '';
    renderSchedule();
    await syncToCloud();
  }

  async function deleteHW() {
    if (window.isGuest || !window.isAdmin) {
      alert('Редактирование ДЗ доступно только администраторам.');
      return;
    }
    const date = document.getElementById('dateSelect').value;
    const subj = document.getElementById('subjectSelect').value;
    const key = `${date}_${subj}`;
    if (!hwDatabase[key]) { alert('Для этой пары и так нет сохранённого задания.'); return; }
    if (!confirm(`Удалить домашнее задание по предмету "${subj}"?`)) return;
    delete hwDatabase[key];
    renderSchedule();
    await syncToCloud();
  }

  function toggleAdmin() {
    if (window.isGuest || !window.isAdmin) {
      alert('Редактирование ДЗ доступно только администраторам.');
      return;
    }
    const box = document.getElementById('adminBox');
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
  }

  window.onload = function () {
    const n = new Date();
    document.getElementById('dateSelect').value =
      `${n.getFullYear()}-${String(n.getMonth() + 1).padStart(2, '0')}-${String(n.getDate()).padStart(2, '0')}`;
    loadHWFromCloud();
  };
</script>
</body>
</html>
