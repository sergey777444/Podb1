<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 Лекционные конспекты — ФЛ1-ПОДб-11</title>
<link rel="stylesheet" href="theme.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script src="app.js?v=14"></script>
<style>
.add-box{margin-bottom:26px}
.add-box h3{margin-bottom:16px;font:italic 800 19px var(--serif)}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-custom{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media(max-width:700px){.form-grid-2,.form-grid-custom{grid-template-columns:1fr}}
.notes-grid{display:grid;gap:16px}
.note-card{position:relative;padding:18px 18px 18px 20px;background:var(--card);border:2px solid var(--line);border-left:10px solid var(--violet);border-radius:var(--r);box-shadow:var(--sh)}
.note-header{margin-bottom:12px;padding:0 40px 12px 0;border-bottom:2px dashed var(--line)}
.note-subject{display:inline-block;padding:2px 9px;border:2px solid var(--line);border-radius:8px;background:var(--yel);color:#1b1f3b;font:800 11px var(--sans);letter-spacing:.05em;text-transform:uppercase}
.note-title{margin:8px 0 4px;font:italic 800 20px/1.2 var(--serif)}
.note-meta{display:flex;flex-wrap:wrap;gap:14px;margin-top:6px;color:var(--soft);font-size:12px}
.note-content{margin:12px 0;color:var(--soft);font-size:14px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.btn-link{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:14px;padding:12px 16px;border:2px solid var(--line);border-radius:12px;background:var(--yel);color:#1b1f3b;font-weight:800;font-size:14px;box-shadow:3px 3px 0 var(--shc)}
.btn-link:active{transform:translate(3px,3px);box-shadow:none}
.delete-btn{position:absolute;top:14px;right:14px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:10px;background:var(--card);font-size:14px}
.delete-btn:hover{background:var(--red)}
.search-row{margin-bottom:4px}
</style>
</head>
<body>
<div class="container">

  <header class="hero">
    <span class="badge">🎓 ФЛ1 • ПОДб-11</span>
    <h1>Лекционные <span class="hl">конспекты</span></h1>
    <p>Ссылки на конспекты по дисциплинам</p>
  </header>

  <div class="box add-box">
    <h3>🔗 Добавить ссылку на конспект (Google Диск, Яндекс и др.)</h3>
    <form id="noteForm" onsubmit="saveNote(event)">
      <div class="form-grid-2">
        <div class="form-group">
          <label>Дисциплина *</label>
          <select id="subjectSelect" class="form-control" required>
            <option value="История России">История России</option>
            <option value="ТМК">ТМК (Теория межкультурной коммуникации)</option>
            <option value="СТПОИ">СТПОИ (Средства поиска информации)</option>
            <option value="ОРГ">ОРГ (Российская государственность)</option>
            <option value="ТЦО">ТЦО (Цифровое образование)</option>
          </select>
        </div>
        <div class="form-group">
          <label>№ лекции *</label>
          <input type="text" id="lectureNumInput" class="form-control" placeholder="Например: Лекция №1" required>
        </div>
      </div>
      <div class="form-grid-custom">
        <div class="form-group">
          <label>Тема лекции *</label>
          <input type="text" id="titleInput" class="form-control" placeholder="Тема лекции" required>
        </div>
        <div class="form-group">
          <label>Дата лекции *</label>
          <input type="date" id="lectureDateInput" class="form-control" required>
        </div>
      </div>
      <div class="form-group">
        <label>Ссылка на файл / документ (PDF) *</label>
        <input type="url" id="linkInput" class="form-control" placeholder="https://drive.google.com/file/d/... или ссылка на Яндекс.Диск" required>
      </div>
      <div class="form-group">
        <label>Краткое описание / Тезисы (необязательно)</label>
        <textarea id="contentText" class="form-control" rows="2" placeholder="Краткая аннотация или важные даты..."></textarea>
      </div>
      <button type="submit" id="submitBtn" class="btn block">Опубликовать конспект</button>
    </form>
  </div>

  <div class="search-row">
    <input type="text" id="searchInput" class="form-control" placeholder="🔍 Поиск лекций по теме, номеру, тексту..." oninput="renderNotes()">
    <div class="chips filter-tags">
      <button class="chip on" onclick="filterByTag('all', this)">Все лекции</button>
      <button class="chip" onclick="filterByTag('История России', this)">История России</button>
      <button class="chip" onclick="filterByTag('ТМК', this)">ТМК</button>
      <button class="chip" onclick="filterByTag('СТПОИ', this)">СТПОИ</button>
      <button class="chip" onclick="filterByTag('ОРГ', this)">ОРГ</button>
      <button class="chip" onclick="filterByTag('ТЦО', this)">ТЦО</button>
    </div>
  </div>

  <div class="status" id="statusBar">Загрузка лекционных конспектов...</div>
  <div class="notes-grid" id="notesContainer"></div>
</div>

<script>
  /* Запросы к этому адресу перехватывает app.js и отправляет в Supabase */
  const API_URL = "https://api.npoint.io/b0bf097d8c176bdc856e";

  let allNotes = [];
  let activeTag = 'all';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function formatDate(s) {
    if (!s) return '';
    const d = new Date(s);
    return isNaN(d) ? s : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  async function fetchNotes() {
    const bar = document.getElementById('statusBar');
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('Ошибка сети');
      const data = await res.json();
      allNotes = Array.isArray(data) ? data : [];
      bar.innerText = `Загружено лекций: ${allNotes.length}`;
      renderNotes();
    } catch (err) {
      console.error(err);
      bar.innerText = '❌ Ошибка загрузки. Проверьте подключение.';
    }
  }

  async function postNotes(list) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=UTF-8' },
      body: JSON.stringify(list)
    });
    if (!res.ok) throw new Error('Ошибка сервера');
  }

  async function saveNote(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const bar = document.getElementById('statusBar');
    btn.disabled = true; btn.innerText = 'Сохранение...';
    try {
      const newNote = {
        id: Date.now(),
        subject: document.getElementById('subjectSelect').value,
        title: document.getElementById('titleInput').value.trim(),
        lectureNum: document.getElementById('lectureNumInput').value.trim(),
        lectureDate: document.getElementById('lectureDateInput').value,
        content: document.getElementById('contentText').value.trim(),
        link: document.getElementById('linkInput').value.trim(),
        addedDate: new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })
      };
      const updated = [newNote, ...allNotes];
      await postNotes(updated);
      allNotes = updated;
      document.getElementById('noteForm').reset();
      bar.innerText = '✅ Конспект добавлен!';
      renderNotes();
    } catch (err) {
      console.error(err);
      alert('Ошибка при сохранении (нужны права админа).');
    } finally {
      btn.disabled = false; btn.innerText = 'Опубликовать конспект';
    }
  }

  async function deleteNote(id) {
    if (!confirm('Удалить этот конспект лекции?')) return;
    const bar = document.getElementById('statusBar');
    const updated = allNotes.filter(n => n.id !== id);
    try {
      await postNotes(updated);
      allNotes = updated;
      bar.innerText = '✅ Конспект удалён';
      renderNotes();
    } catch (err) {
      console.error(err);
      alert('Не удалось удалить (нужны права админа).');
      fetchNotes();
    }
  }

  function noteLink(link) {
    if (!link) return '#';
    if (link.includes('drive.google.com')) return link.replace(/\/(preview|view|edit).*$/, '') + '/view';
    return link;
  }

  function renderNotes() {
    const box = document.getElementById('notesContainer');
    const q = document.getElementById('searchInput').value.toLowerCase();
    const list = allNotes.filter(n => {
      const tag = activeTag === 'all' || n.subject === activeTag;
      const hit = [n.title, n.content, n.lectureNum, n.subject].some(v => v && String(v).toLowerCase().includes(q));
      return tag && hit;
    });
    if (!list.length) {
      box.innerHTML = '<p class="empty">Конспекты не найдены.</p>';
      return;
    }
    box.innerHTML = list.map(n => `
      <div class="note-card">
        <button class="delete-btn" onclick="deleteNote(${Number(n.id)})" title="Удалить">🗑️</button>
        <div class="note-header">
          <span class="note-subject">Лекция • ${esc(n.subject)}</span>
          <div class="note-title">${n.lectureNum ? `[${esc(n.lectureNum)}] ` : ''}${esc(n.title)}</div>
          <div class="note-meta">
            ${n.lectureDate ? `<span>📅 Дата лекции: ${formatDate(n.lectureDate)}</span>` : ''}
            <span>🕒 Добавлено: ${esc(n.addedDate || '')}</span>
          </div>
        </div>
        ${n.content ? `<div class="note-content">${esc(n.content)}</div>` : ''}
        ${n.link ? `<a href="${esc(noteLink(n.link))}" target="_blank" rel="noopener" class="btn-link">📄 Открыть конспект</a>` : ''}
      </div>`).join('');
  }

  function filterByTag(tag, btn) {
    document.querySelectorAll('.filter-tags .chip').forEach(t => t.classList.remove('on'));
    btn.classList.add('on');
    activeTag = tag;
    renderNotes();
  }

  fetchNotes();
</script>
</body>
</html>
