<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script src="app.is?v=10"></script>
<title>📖 Лекционные конспекты — ФЛ1-ПОДб-11</title>
<script>
  if (localStorage.getItem('user-theme') === 'light') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', 'dark');
</script>
<style>
:root{--bg:#080b14;--bg2:#0e1320;--card:rgba(19,25,40,.78);--card-h:rgba(25,32,51,.9);--text:#f4f7ff;--text2:#aeb8cc;--muted:#78839a;--border:rgba(255,255,255,.09);--accent:#7c6cff;--accent3:#8b5cf6;--danger:#ff6878;--shadow:0 20px 70px rgba(0,0,0,.35);--rl:20px;--rm:14px}
[data-theme="light"]{--bg:#f3f6fb;--bg2:#fff;--card:rgba(255,255,255,.84);--card-h:rgba(255,255,255,.98);--text:#172033;--text2:#5d687b;--muted:#7c8799;--border:rgba(20,30,50,.09);--accent:#6557e8;--accent3:#7848dc;--shadow:0 20px 60px rgba(40,50,80,.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:radial-gradient(circle at 10% 10%,rgba(124,108,255,.17),transparent 28%),radial-gradient(circle at 90% 20%,rgba(69,202,255,.12),transparent 25%),var(--bg);padding:20px 10px 60px}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}
.container{width:min(1180px,calc(100% - 32px));margin:0 auto}
.hero{padding:34px;margin-bottom:24px;border:1px solid var(--border);border-radius:28px;background:linear-gradient(135deg,rgba(124,108,255,.14),rgba(69,202,255,.05) 45%,var(--card));box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.badge{display:inline-flex;padding:7px 12px;border-radius:999px;background:rgba(124,108,255,.13);border:1px solid rgba(124,108,255,.24);color:#bdb6ff;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px}
[data-theme="light"] .badge{color:#5c50c9}
.hero h1{font-size:clamp(24px,4vw,36px);letter-spacing:-.03em}
.theme-btn{height:48px;padding:0 16px;border:1px solid var(--border);border-radius:14px;color:var(--text);background:rgba(255,255,255,.05);font-weight:700;display:inline-flex;align-items:center;gap:8px}
.add-box{border:1px solid var(--border);border-radius:var(--rl);padding:24px;margin-bottom:28px;background:var(--card);box-shadow:var(--shadow)}
.add-box h3{margin-bottom:16px;font-size:18px}
.form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid-custom{display:grid;grid-template-columns:2fr 1fr;gap:12px}
@media(max-width:700px){.form-grid-2,.form-grid-custom{grid-template-columns:1fr}}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.form-control{width:100%;padding:12px 14px;font-size:13px;border:1px solid var(--border);border-radius:var(--rm);background:rgba(255,255,255,.035);color:var(--text);outline:none}
.form-control:focus{border-color:rgba(124,108,255,.65);box-shadow:0 0 0 4px rgba(124,108,255,.11)}
select.form-control option{background:var(--bg2);color:var(--text)}
.btn-submit{background:linear-gradient(135deg,var(--accent),var(--accent3));color:#fff;border:none;padding:13px 20px;border-radius:var(--rm);font-weight:700;font-size:14px;width:100%;margin-top:6px;box-shadow:0 8px 25px rgba(124,108,255,.3)}
.btn-submit:disabled{opacity:.5;cursor:not-allowed}
.tools-section{margin-bottom:24px}
.filter-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{background:rgba(255,255,255,.045);color:var(--text2);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid var(--border)}
.tag:hover,.tag.active{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent3));border-color:transparent}
.status-bar{font-size:12px;color:var(--muted);margin-bottom:20px;padding-left:3px}
.notes-grid{display:grid;gap:16px}
.note-card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--rl);padding:22px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.note-header{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);padding-right:35px}
.note-subject{font-size:11px;font-weight:800;text-transform:uppercase;color:var(--accent);background:rgba(124,108,255,.12);padding:4px 10px;border-radius:8px;border:1px solid rgba(124,108,255,.25);letter-spacing:.05em}
.note-title{font-size:18px;font-weight:800;margin:8px 0 4px;letter-spacing:-.02em}
.note-meta{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.note-content{font-size:13px;line-height:1.6;margin:12px 0;color:var(--text2);white-space:pre-wrap;word-break:break-word}
.btn-link{display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(124,108,255,.15);border:1px solid rgba(124,108,255,.3);color:var(--text);padding:12px 16px;border-radius:12px;font-size:13px;font-weight:700;margin-top:14px}
.btn-link:hover{background:rgba(124,108,255,.25)}
.delete-btn{position:absolute;top:18px;right:18px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px}
.delete-btn:hover{background:rgba(255,104,120,.15);color:var(--danger);border-color:rgba(255,104,120,.35)}
@media(max-width:600px){.hero{padding:22px}.add-box{padding:18px}}
</style>
</head>
<body>
<div class="container">

  <header class="hero">
    <div>
      <div class="badge">🎓 ФЛ1 • ПОДб-11</div>
      <h1>📖 Лекционные конспекты</h1>
    </div>
    <button class="theme-btn" onclick="toggleTheme()"><span id="themeIcon">☀️</span><span id="themeText">Светлая</span></button>
  </header>

  <div class="add-box">
    <h3>🔗 Добавить ссылку на конспект (Google Диск, Яндекс и др.)</h3>
    <form id="noteForm" onsubmit="saveNote(event)">
      <div class="form-grid-2">
        <div class="form-group">
          <label>Дисциплина *</label>
          <select id="subjectSelect" class="form-control" required>
            <option value="История России">История России</option>
            <option value="ТМК">ТМК (Теория межкультурной коммуникации)</option>
            <option value="СТПОИ">СТПОИ (Средства поиска информации)</option>
            <option value="ОРГ">ОРГ (Российская государственность)</option>
            <option value="ТЦО">ТЦО (Цифровое образование)</option>
          </select>
        </div>
        <div class="form-group">
          <label>№ лекции *</label>
          <input type="text" id="lectureNumInput" class="form-control" placeholder="Например: Лекция №1" required>
        </div>
      </div>
      <div class="form-grid-custom">
        <div class="form-group">
          <label>Тема лекции *</label>
          <input type="text" id="titleInput" class="form-control" placeholder="Тема лекции" required>
        </div>
        <div class="form-group">
          <label>Дата лекции *</label>
          <input type="date" id="lectureDateInput" class="form-control" required>
        </div>
      </div>
      <div class="form-group">
        <label>Ссылка на файл / документ (PDF) *</label>
        <input type="url" id="linkInput" class="form-control" placeholder="https://drive.google.com/file/d/... или ссылка на Яндекс.Диск" required>
      </div>
      <div class="form-group">
        <label>Краткое описание / Тезисы (необязательно)</label>
        <textarea id="contentText" class="form-control" rows="2" placeholder="Краткая аннотация или важные даты..."></textarea>
      </div>
      <button type="submit" id="submitBtn" class="btn-submit">Опубликовать конспект</button>
    </form>
  </div>

  <div class="tools-section">
    <input type="text" id="searchInput" class="form-control" placeholder="🔍 Поиск лекций по теме, номеру, тексту..." oninput="renderNotes()">
    <div class="filter-tags">
      <button class="tag active" onclick="filterByTag('all', this)">Все лекции</button>
      <button class="tag" onclick="filterByTag('История России', this)">История России</button>
      <button class="tag" onclick="filterByTag('ТМК', this)">ТМК</button>
      <button class="tag" onclick="filterByTag('СТПОИ', this)">СТПОИ</button>
      <button class="tag" onclick="filterByTag('ОРГ', this)">ОРГ</button>
      <button class="tag" onclick="filterByTag('ТЦО', this)">ТЦО</button>
    </div>
  </div>

  <div class="status-bar" id="statusBar">Загрузка лекционных конспектов...</div>
  <div class="notes-grid" id="notesContainer"></div>
</div>

<script>
  /* Запросы к этому адресу перехватывает app.js и отправляет в Supabase */
  const API_URL = "https://api.npoint.io/b0bf097d8c176bdc856e";

  let allNotes = [];
  let activeTag = 'all';
  const html = document.documentElement;

  function applyTheme(theme) {
    const icon = document.getElementById("themeIcon"), text = document.getElementById("themeText");
    if (theme === 'light') { html.removeAttribute('data-theme'); icon.textContent = "🌙"; text.textContent = "Тёмная"; }
    else { html.setAttribute('data-theme', 'dark'); icon.textContent = "☀️"; text.textContent = "Светлая"; }
  }
  function toggleTheme() {
    const t = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    localStorage.setItem('user-theme', t); applyTheme(t);
  }
  applyTheme(localStorage.getItem('user-theme') || 'dark');

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

  function formatDate(s) {
    if (!s) return '';
    const d = new Date(s);
    return isNaN(d) ? s : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  async function fetchNotes() {
    const bar = document.getElementById('statusBar');
    try {
      const res = await fetch(API_URL);
      if (!res.ok) throw new Error('Ошибка сети');
      const data = await res.json();
      allNotes = Array.isArray(data) ? data : [];
      bar.innerText = `Загружено лекций: ${allNotes.length}`;
      renderNotes();
    } catch (err) {
      console.error(err);
      bar.innerText = '❌ Ошибка загрузки. Проверьте подключение.';
    }
  }

  async function postNotes(list) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=UTF-8' },
      body: JSON.stringify(list)
    });
    if (!res.ok) throw new Error('Ошибка сервера');
  }

  async function saveNote(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const bar = document.getElementById('statusBar');
    btn.disabled = true; btn.innerText = 'Сохранение...';
    try {
      const newNote = {
        id: Date.now(),
        subject: document.getElementById('subjectSelect').value,
        title: document.getElementById('titleInput').value.trim(),
        lectureNum: document.getElementById('lectureNumInput').value.trim(),
        lectureDate: document.getElementById('lectureDateInput').value,
        content: document.getElementById('contentText').value.trim(),
        link: document.getElementById('linkInput').value.trim(),
        addedDate: new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })
      };
      const updated = [newNote, ...allNotes];
      await postNotes(updated);
      allNotes = updated;
      document.getElementById('noteForm').reset();
      bar.innerText = '✅ Конспект добавлен!';
      renderNotes();
    } catch (err) {
      console.error(err);
      alert('Ошибка при сохранении (нужны права админа).');
    } finally {
      btn.disabled = false; btn.innerText = 'Опубликовать конспект';
    }
  }

  async function deleteNote(id) {
    if (!confirm('Удалить этот конспект лекции?')) return;
    const bar = document.getElementById('statusBar');
    const updated = allNotes.filter(n => n.id !== id);
    try {
      await postNotes(updated);
      allNotes = updated;
      bar.innerText = '✅ Конспект удалён';
      renderNotes();
    } catch (err) {
      console.error(err);
      alert('Не удалось удалить (нужны права админа).');
      fetchNotes();
    }
  }

  function noteLink(link) {
    if (!link) return '#';
    if (link.includes('drive.google.com')) return link.replace(/\/(preview|view|edit).*$/, '') + '/view';
    return link;
  }

  function renderNotes() {
    const box = document.getElementById('notesContainer');
    const q = document.getElementById('searchInput').value.toLowerCase();
    const list = allNotes.filter(n => {
      const tag = activeTag === 'all' || n.subject === activeTag;
      const hit = [n.title, n.content, n.lectureNum, n.subject].some(v => v && String(v).toLowerCase().includes(q));
      return tag && hit;
    });
    if (!list.length) {
      box.innerHTML = '<p style="text-align:center;color:var(--muted);margin-top:20px">Конспекты не найдены.</p>';
      return;
    }
    box.innerHTML = list.map(n => `
      <div class="note-card">
        <button class="delete-btn" onclick="deleteNote(${Number(n.id)})" title="Удалить">🗑️</button>
        <div class="note-header">
          <span class="note-subject">Лекция • ${esc(n.subject)}</span>
          <div class="note-title">${n.lectureNum ? `[${esc(n.lectureNum)}] ` : ''}${esc(n.title)}</div>
          <div class="note-meta">
            ${n.lectureDate ? `<span>📅 Дата лекции: ${formatDate(n.lectureDate)}</span>` : ''}
            <span>🕒 Добавлено: ${esc(n.addedDate || '')}</span>
          </div>
        </div>
        ${n.content ? `<div class="note-content">${esc(n.content)}</div>` : ''}
        ${n.link ? `<a href="${esc(noteLink(n.link))}" target="_blank" rel="noopener" class="btn-link">📄 Открыть конспект</a>` : ''}
      </div>`).join('');
  }

  function filterByTag(tag, btn) {
    document.querySelectorAll('.filter-tags .tag').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    activeTag = tag;
    renderNotes();
  }

  fetchNotes();
</script>
</body>
</html>
