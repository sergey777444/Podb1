<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Неправильные глаголы • ФЛ1 ПОДб-11</title>
<link rel="stylesheet" href="theme.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script src="irregular-data.js?v=2"></script>
<script src="app.js?v=25"></script>
<style>
.hero{margin-bottom:6px;padding:16px 18px}
.hero .badge{margin-bottom:8px}
h2.sec{margin:16px 0 4px}
.deck{height:270px;margin-top:14px;margin-bottom:12px}
.hint-line{margin-top:10px;text-align:center;color:var(--soft);font-size:12.5px}
.chips button .cnt{margin-left:6px;font-weight:600;opacity:.75;font-size:12px}
.chips.opts button{font-size:12.5px}
.deck .face .big{font-size:clamp(34px,10vw,52px)}
.deck .face .big.ru{font-size:clamp(26px,7.5vw,38px)}
.deck .face .bk{max-width:92%;font:800 clamp(24px,7vw,32px)/1.15 var(--serif);text-align:center;word-break:break-word}
.deck .face .bk.ru{color:var(--blue)}
.deck .face .tip{position:absolute;bottom:14px;left:0;right:0;text-align:center}
.forms{width:100%;max-width:320px;display:grid;gap:6px}
.forms div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:8px 0;border-bottom:2px dashed var(--grid)}
.forms div:last-child{border-bottom:none}
.forms small{color:var(--soft);font:800 11px var(--sans);letter-spacing:.07em;text-transform:uppercase;text-align:left}
.forms b{font:800 24px var(--serif);text-align:right;word-break:break-word}
.deck .face .note{max-width:92%;padding:8px 10px;border:2px dashed var(--line);border-radius:12px;color:var(--soft);font-size:12.5px;line-height:1.45}
.deck-empty{padding:30px 10px;text-align:center;color:var(--soft)}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
#done[hidden],.deck[hidden],.ctl[hidden]{display:none}
.group{margin-bottom:22px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 4px 10px}
.gh h2{font:italic 800 16px var(--serif)}.gh small{color:var(--soft);font-weight:700;white-space:nowrap}
.w{display:flex;gap:12px;align-items:center;margin-bottom:8px;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;user-select:none}
.w.ok{background:var(--ok-bg);border-color:var(--green)}
.chk{flex:0 0 26px;height:26px;display:grid;place-items:center;border:2px solid var(--line);border-radius:8px;color:transparent;font-size:14px;font-weight:800}
.w.ok .chk{background:var(--green);border-color:var(--green);color:#fff}
.la{font:800 17px var(--serif);word-break:break-word}
.ru2{margin-top:1px;color:var(--blue);font-size:13px;font-weight:700}
.form-control{margin-top:14px}
#tSetup[hidden],#tRun[hidden],#tRes[hidden]{display:none}
.t-box{margin-bottom:14px}
.t-lab{margin:16px 0 6px;color:var(--soft);font:800 11px var(--sans);letter-spacing:.07em;text-transform:uppercase}
.t-lab:first-child{margin-top:0}
.t-chips{display:flex;flex-wrap:wrap;gap:6px}
.t-chips .chip{padding:7px 12px}
.t-btn{padding:12px 16px;border:2px solid var(--line);border-radius:12px;background:var(--yel);color:#1b1f3b;font:800 15px var(--sans);box-shadow:3px 3px 0 var(--shc);cursor:pointer}
.t-btn:disabled{opacity:.5}
.t-btn.ghost{background:var(--card);color:var(--ink)}
.t-btn.full{display:block;width:100%;margin-top:16px}
.t-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.t-act .t-btn{flex:1 1 auto}
.t-top{display:flex;justify-content:space-between;margin:12px 2px 8px;font-weight:800;font-size:13px}
.t-q{margin-top:14px;padding:18px 16px;border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:4px 4px 0 var(--shc);text-align:center}
.t-ask{margin-top:8px;color:var(--soft);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.t-big{margin-top:8px;font:800 28px var(--serif);word-break:break-word}
.t-sub{margin-top:6px;color:var(--soft);font-size:13px;font-weight:600}
.t-in{display:block;width:100%;box-sizing:border-box;margin-top:14px;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:600 18px var(--serif);outline:none}
.t-opt{display:block;width:100%;margin-top:8px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:700 15px var(--sans);text-align:left;cursor:pointer}
.t-opt.ok,.t-fb.ok{background:var(--ok-bg);border-color:var(--green)}
.t-opt.no,.t-fb.no{background:var(--no-bg);border-color:var(--red)}
.t-fb{margin-top:12px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;font-size:14px;line-height:1.5}
.t-score{text-align:center;font:italic 800 46px var(--serif)}
.t-wr{margin-top:8px;padding:10px 12px;border:2px solid var(--red);border-radius:12px;background:var(--no-bg);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="container narrow">

  <header class="hero">
    <span class="badge">Грамматика</span>
    <h1>Неправильные <span class="hl">глаголы</span></h1>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" aria-selected="true" data-t="c">Карточки</button>
    <button type="button" role="tab" aria-selected="false" data-t="l">Список</button>
    <button type="button" role="tab" aria-selected="false" data-t="t">Тест</button>
  </nav>

  <div id="common">
  <h2 class="sec">Группы <small id="selInfo"></small></h2>
  <div class="chips scroll" id="groups" role="group" aria-label="Группы глаголов"></div>
  </div>

  <section id="c" class="pane on">
  <div class="chips scroll" id="dirChips" role="group" aria-label="Что видно на лицевой стороне"></div>
  <div class="chips scroll opts" id="opts">
    <button type="button" id="oNew" aria-pressed="false">Только невыученные</button>
    <button type="button" id="oShuf" aria-pressed="true">🔀 Перемешать</button>
    <button type="button" id="oReset">↺ Сбросить</button>
  </div>

  <div class="bar" aria-hidden="true"><div id="barFill"></div></div>
  <div class="stat"><span id="stL"></span><span id="stR"></span></div>

  <div class="deck" id="deck"></div>
  <div class="ctl" id="ctl">
    <button type="button" class="no" id="bNo" aria-label="Ещё повторить">✗</button>
    <button type="button" class="sm" id="bFlip" aria-label="Перевернуть">↻</button>
    <button type="button" class="ok" id="bOk" aria-label="Знаю">✓</button>
  </div>

  <p class="hint-line">Вправо — знаю, влево — ещё повторить. Нажми на карточку, чтобы увидеть формы.</p>
  <div class="box done" id="done" hidden></div>
  </section>

  <section id="l" class="pane">
    <input type="search" id="q" class="form-control" placeholder="🔍 Поиск по глаголу или переводу…" autocomplete="off">
    <p class="hint-line">Нажми на глагол, чтобы отметить его выученным</p>
    <div id="list"></div>
  </section>

  <section id="t" class="pane">
    <div id="tSetup"></div>
    <div id="tRun" hidden></div>
    <div id="tRes" hidden></div>
  </section>
  <div class="status" id="status" role="status"></div>

</div>

<script>
(function () {
  'use strict';
  var KEY = 'grammar_irregular_verbs_learned';   /* Грамматика → Неправильные глаголы */
  var K_SEL = 'irv_groups', K_NEW = 'irv_only_new', K_SHUF = 'irv_shuffle', K_DIR = 'irv_dir';
  var GROUPS = window.IRREGULAR_VERBS || [];

  var NOTES = {
    burn: 'UK: чаще burnt, можно и burned. US: обычно burned. Но burnt toast говорят везде.',
    learn: 'UK: learnt / learned. US: обычно learned.',
    smell: 'UK: smelt / smelled. US: обычно smelled.',
    spell: 'UK: spelt / spelled. US: обычно spelled.',
    spill: 'UK: spilt / spilled. US: обычно spilled.',
    spoil: 'UK: spoilt / spoiled. US: обычно spoiled.',
    dream: 'UK: dreamt /dremt/ или dreamed /driːmd/. US: dreamed.',
    lean: 'UK: leant /lent/ или leaned. US: leaned.',
    leap: 'UK: leapt /lept/ или leaped. US: leaped.',
    dive: 'UK: dived. US: dived или dove.',
    get: 'got — Британия; gotten (как Past Participle) — США.'
  };

  var $ = function (s) { return document.querySelector(s); };
  var esc = function (t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  function lsGet(k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function shuffleArr(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  var learned = new Set(lsGet(KEY, []) || []);
  var sel = new Set();
  var savedSel = lsGet(K_SEL, null);
  if (Array.isArray(savedSel)) savedSel.forEach(function (i) { if (GROUPS[i]) sel.add(i); });
  if (!sel.size) GROUPS.forEach(function (g, i) { sel.add(i); });
  var onlyNew = !!lsGet(K_NEW, false);
  var shuffle = lsGet(K_SHUF, true) !== false;
  var dir = lsGet(K_DIR, 'en') === 'ru' ? 'ru' : 'en';   /* en: на карточке слово, ru: на карточке перевод */
  var queue = [], sKnown = 0, sAgain = 0, busy = false;

  function items() {
    var out = [];
    GROUPS.forEach(function (g, gi) { if (sel.has(gi)) g.words.forEach(function (w) { out.push({ g: gi, w: w }); }); });
    return out;
  }

  /* ---------- сохранение: в профиль (облако) + запасной localStorage ---------- */
  var pt = 0;
  function status(msg) {
    var el = $('#status');
    if (msg) { el.textContent = msg; return; }
    el.textContent = window.currentUser ? '☁️ Прогресс сохраняется в профиле (Грамматика → Неправильные глаголы)'
      : '💾 Прогресс только в этом браузере — аккаунт не подтверждён админом';
  }
  function persist() {
    lsSet(KEY, Array.from(learned));
    clearTimeout(pt);
    pt = setTimeout(function () {
      Promise.resolve(window.userData ? window.userData.set(KEY, Array.from(learned)) : null)
        .then(function () { status(); })
        .catch(function (e) { console.error(e); status('⚠️ В облако не сохранилось — прогресс остался в браузере'); });
    }, 500);
  }

  /* ---------- отрисовка ---------- */
  function renderChips() {
    var box = $('#groups');
    var all = sel.size === GROUPS.length;
    var html = '<button type="button" data-g="all" aria-pressed="' + all + '">Все группы</button>';
    GROUPS.forEach(function (g, i) {
      var n = g.words.filter(function (w) { return learned.has(w[0]); }).length;
      html += '<button type="button" data-g="' + i + '" aria-pressed="' + sel.has(i) + '" title="' + esc(g.title) + '">' + esc(g.title.split(' · ')[0]) +
        '<span class="cnt">' + n + '/' + g.words.length + '</span></button>';
    });
    box.innerHTML = html;
    var parts = GROUPS.filter(function (g, i) { return sel.has(i); }).map(function (g) { return g.title.split(' · ')[1]; });
    $('#selInfo').textContent = all ? 'все' : parts.join(', ');
    $('#oNew').setAttribute('aria-pressed', onlyNew);
    $('#oShuf').setAttribute('aria-pressed', shuffle);
    $('#dirChips').innerHTML = [['en', 'EN → RU', 'Видно слово, перевод на обороте'], ['ru', 'RU → EN', 'Виден перевод, слово на обороте']]
      .map(function (d) { return '<button type="button" data-d="' + d[0] + '" aria-pressed="' + (dir === d[0]) + '" title="' + d[2] + '">' + d[1] + '</button>'; }).join('');
  }

  function renderStats() {
    var all = items(), t = all.length;
    var l = all.filter(function (x) { return learned.has(x.w[0]); }).length;
    var pct = t ? Math.round(l / t * 100) : 0;
    $('#barFill').style.width = pct + '%';
    $('#stL').textContent = 'Выучено ' + l + ' из ' + t + ' · ' + pct + '%';
    $('#stR').textContent = queue.length ? 'В колоде: ' + queue.length : '';
  }

  function cardHtml(x, cls) {
    var v = x.w[0], p = x.w[1], pp = x.w[2], ru = x.w[3], g = GROUPS[x.g], note = NOTES[v];
    return '<div class="card ' + cls + '"><div class="inner">' +
      '<div class="face"><span class="tag">' + esc(g.title) + '</span>' + (dir === 'en' ? '<div class="big">' + esc(v) + '</div>' : '<div class="big ru">' + esc(ru) + '</div>') + '<div class="tip">' + (dir === 'en' ? 'нажми — перевод и формы' : 'нажми — глагол и формы') + '</div></div>' +
      '<div class="face back"><span class="tag">' + esc(g.title) + '</span>' + (dir === 'en' ? '<div class="bk ru">' + esc(ru) + '</div>' : '<div class="bk">' + esc(v) + '</div>') +
      '<div class="forms"><div><small>Past Simple</small><b>' + esc(p) + '</b></div><div><small>Past Participle</small><b>' + esc(pp) + '</b></div></div>' +
      (note ? '<div class="note">' + esc(note) + '</div>' : '') + '</div></div>' +
      '<div class="stampR">ЗНАЮ</div><div class="stampL">ЕЩЁ</div></div>';
  }

  function renderDeck() {
    var deck = $('#deck'), done = $('#done'), ctl = $('#ctl');
    busy = false;
    if (!queue.length) {
      deck.hidden = true; ctl.hidden = true; done.hidden = false;
      var rest = items().filter(function (x) { return !learned.has(x.w[0]); }).length;
      done.innerHTML = '<h3>' + (items().length ? '🎉 Колода пройдена' : 'Нет карточек') + '</h3>' +
        '<p class="tip">' + (items().length ? 'Выучено за подход: ' + sKnown + ' · повторов: ' + sAgain + (rest ? ' · ещё не выучено: ' + rest : ' · всё выучено!') : (onlyNew ? 'В выбранных группах всё выучено — выключи «Только невыученные».' : 'Выбери хотя бы одну группу.')) + '</p>' +
        '<div class="row-actions"><button type="button" id="dAll">Заново все</button>' + (rest ? '<button type="button" id="dNew">Только невыученные</button>' : '') + '</div>';
      var a = $('#dAll'), n = $('#dNew');
      if (a) a.onclick = function () { onlyNew = false; lsSet(K_NEW, false); rebuild(); };
      if (n) n.onclick = function () { onlyNew = true; lsSet(K_NEW, true); rebuild(); };
      return;
    }
    done.hidden = true; deck.hidden = false; ctl.hidden = false;
    var html = '';
    [2, 1, 0].forEach(function (i) { if (queue[i]) html += cardHtml(queue[i], i === 0 ? '' : (i === 1 ? 'under' : 'under2')); });
    deck.innerHTML = html;
    attach(deck.lastElementChild);
  }

  function render() { renderChips(); renderStats(); renderDeck(); renderList(); }

  function rebuild() {
    var it = items();
    if (onlyNew) it = it.filter(function (x) { return !learned.has(x.w[0]); });
    if (shuffle) shuffleArr(it);
    queue = it; sKnown = 0; sAgain = 0;
    render();
  }

  /* ---------- действия ---------- */
  function topCard() { return $('#deck .card:last-child'); }
  function flip() { var c = topCard(); if (c && !busy) c.classList.toggle('flip'); }

  function act(known) {
    if (busy || !queue.length) return;
    var c = topCard(); if (!c) return;
    busy = true;
    c.style.transition = 'transform .28s, opacity .28s';
    c.style.transform = 'translateX(' + (known ? 520 : -520) + 'px) rotate(' + (known ? 22 : -22) + 'deg)';
    c.style.opacity = '0';
    setTimeout(function () {
      var x = queue.shift();
      if (known) { learned.add(x.w[0]); sKnown++; }
      else { learned.delete(x.w[0]); sAgain++; queue.splice(Math.min(queue.length, 4), 0, x); }
      persist();
      render();
    }, 260);
  }

  function attach(card) {
    if (!card) return;
    var st = null;
    card.addEventListener('pointerdown', function (e) {
      if (busy) return;
      st = { x: e.clientX, y: e.clientY, dx: 0, moved: false };
      try { card.setPointerCapture(e.pointerId); } catch (er) {}
      card.style.transition = 'none';
    });
    card.addEventListener('pointermove', function (e) {
      if (!st) return;
      st.dx = e.clientX - st.x;
      var dy = e.clientY - st.y;
      if (Math.abs(st.dx) > 8 || Math.abs(dy) > 8) st.moved = true;
      if (!st.moved) return;
      card.style.transform = 'translateX(' + st.dx + 'px) rotate(' + (st.dx / 18) + 'deg)';
      var r = card.querySelector('.stampR'), l = card.querySelector('.stampL');
      r.style.opacity = Math.max(0, Math.min(1, st.dx / 90));
      l.style.opacity = Math.max(0, Math.min(1, -st.dx / 90));
    });
    function end() {
      if (!st) return;
      var s = st; st = null;
      if (!s.moved) { card.style.transition = ''; flip(); return; }
      if (s.dx > 90) return act(true);
      if (s.dx < -90) return act(false);
      card.style.transition = 'transform .2s';
      card.style.transform = '';
      card.querySelector('.stampR').style.opacity = 0;
      card.querySelector('.stampL').style.opacity = 0;
    }
    card.addEventListener('pointerup', end);
    card.addEventListener('pointercancel', end);
  }

  /* ---------- управление ---------- */
  $('#groups').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var g = b.dataset.g;
    if (g === 'all') { sel = new Set(GROUPS.map(function (x, i) { return i; })); }
    else {
      var i = +g;
      if (sel.has(i)) { if (sel.size > 1) sel.delete(i); } else sel.add(i);
    }
    lsSet(K_SEL, Array.from(sel));
    rebuild();
  });
  $('#dirChips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b || b.dataset.d === dir) return;
    dir = b.dataset.d; lsSet(K_DIR, dir);
    renderChips(); renderDeck();
  });
  $('#oNew').onclick = function () { onlyNew = !onlyNew; lsSet(K_NEW, onlyNew); rebuild(); };
  $('#oShuf').onclick = function () { shuffle = !shuffle; lsSet(K_SHUF, shuffle); rebuild(); };
  $('#oReset').onclick = function () {
    var n = items().filter(function (x) { return learned.has(x.w[0]); }).length;
    if (!n) return;
    if (!confirm('Сбросить выученное в выбранных группах (' + n + ' глаг.)?')) return;
    items().forEach(function (x) { learned.delete(x.w[0]); });
    persist(); rebuild();
  };
  $('#bOk').onclick = function () { act(true); };
  $('#bNo').onclick = function () { act(false); };
  $('#bFlip').onclick = flip;
  document.addEventListener('keydown', function (e) {
    if (!$('#c').classList.contains('on') || (e.target && /INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName))) return;
    if (e.key === 'ArrowRight') act(true);
    else if (e.key === 'ArrowLeft') act(false);
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  });

  /* ---------- список ---------- */
  var query = '';
  function renderList() {
    var q = query.trim().toLowerCase(), out = '';
    GROUPS.forEach(function (g, gi) {
      if (!sel.has(gi)) return;
      var list = g.words.filter(function (w) {
        if (onlyNew && learned.has(w[0])) return false;
        return !q || w.join(' ').toLowerCase().indexOf(q) > -1;
      });
      if (!list.length) return;
      var n = g.words.filter(function (w) { return learned.has(w[0]); }).length;
      out += '<div class="group"><div class="gh"><h2>' + esc(g.title) + '</h2><small>' + n + ' / ' + g.words.length + '</small></div>' +
        list.map(function (w) {
          return '<div class="w' + (learned.has(w[0]) ? ' ok' : '') + '" data-w="' + esc(w[0]) + '" role="button" tabindex="0"><div class="chk">✓</div><div><div class="la">' +
            esc(w.slice(0, 3).join(' — ')) + '</div><div class="ru2">' + esc(w[3]) + '</div></div></div>';
        }).join('') + '</div>';
    });
    $('#list').innerHTML = out || '<p class="hint-line">Ничего не найдено</p>';
  }
  function toggleWord(e) {
    var w = e.target.closest('.w'); if (!w) return;
    var k = w.dataset.w;
    if (learned.has(k)) learned.delete(k); else learned.add(k);
    persist(); rebuild();
  }
  $('#list').addEventListener('click', toggleWord);
  $('#list').addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleWord(e); } });
  $('#q').addEventListener('input', function (e) { query = e.target.value; renderList(); });

  /* ---------- тест ---------- */
  var K_TEST = 'irv_test_cfg', K_ERR = 'irv_test_mistakes';
  var MODES = { ru: 'EN → RU', en: 'RU → EN', fm: '2 и 3 формы' };
  var T = lsGet(K_TEST, null) || {};
  if (!MODES[T.mode]) T.mode = 'fm';
  if (T.input !== 'mc') T.input = 'type';
  if (typeof T.n !== 'number') T.n = 20;
  if (T.status !== 'err') T.status = 'all';
  var errs = new Set(lsGet(K_ERR, []) || []), tq = [], ti = 0, tView = 'setup';

  function tPool() { return items().filter(function (x) { return T.status === 'err' ? errs.has(x.w[0]) : !(onlyNew && learned.has(x.w[0])); }); }
  function tShow(v) { tView = v; $('#tSetup').hidden = v !== 'setup'; $('#tRun').hidden = v !== 'run'; $('#tRes').hidden = v !== 'res'; $('#common').hidden = v !== 'setup' && $('#t').classList.contains('on'); }
  function chip(k, v, label) { return '<button type="button" class="chip' + (T[k] === v ? ' on' : '') + '" data-k="' + k + '" data-v="' + v + '">' + label + '</button>'; }
  function tSetup() {
    var n = tPool().length;
    $('#tSetup').innerHTML = '<div class="box t-box"><div class="t-lab">Что спрашивать</div><div class="t-chips">' + Object.keys(MODES).map(function (m) { return chip('mode', m, MODES[m]); }).join('') +
      '</div><div class="t-lab">Как отвечать</div><div class="t-chips">' + chip('input', 'type', '⌨️ Печатать') + chip('input', 'mc', '🔘 Выбор из 4') +
      '</div><div class="t-lab">Какие слова</div><div class="t-chips">' + chip('status', 'all', 'Из выбранных групп') + chip('status', 'err', '❌ Мои ошибки (' + errs.size + ')') +
      '</div><div class="t-lab">Сколько вопросов</div><div class="t-chips">' + [10, 20, 30, 50].map(function (v) { return chip('n', v, v); }).join('') + chip('n', 0, 'Все') +
      '</div><button type="button" class="t-btn full" id="tStart"' + (n ? '' : ' disabled') + '>▶ Начать · ' + (T.n ? Math.min(T.n, n) : n) + ' вопр.</button></div>';
  }
  /* «was, were», «burnt / burned», «forbad(e)» → допустимые варианты */
  function norm(s) { return String(s).toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim(); }
  function variants(f) {
    var out = [];
    f.replace(/\(US\)/g, '').split(/[\/,]/).forEach(function (p) {
      p = norm(p); if (!p) return;
      if (p.indexOf('(') > -1) out.push(p.replace(/\(.*?\)/g, ''), p.replace(/[()]/g, '')); else out.push(p);
    });
    return out;
  }
  function ruVariants(r) {
    var out = [norm(r)];
    r.split(/[;,]/).forEach(function (p) { out.push(norm(p), norm(p.replace(/\(.*?\)/g, '')), norm(p.replace(/[()]/g, ''))); });
    return out.filter(Boolean);
  }
  function answer(w, m) { return m === 'ru' ? w[3] : m === 'en' ? w[0] : w[1] + ' — ' + w[2]; }
  function check(q, a, b) {
    var w = q.x.w;
    if (q.mode === 'fm') return variants(w[1]).indexOf(norm(a)) > -1 && variants(w[2]).indexOf(norm(b)) > -1;
    if (q.mode === 'ru') return norm(a).split(/[;,]/).some(function (u) { return ruVariants(w[3]).indexOf(u.trim()) > -1; });
    /* одинаковый перевод (класть: lay / put) — подходит любой */
    return GROUPS.some(function (g) { return g.words.some(function (y) { return y[3] === w[3] && norm(a) === y[0]; }); });
  }
  function options(x) {
    var right = answer(x.w, T.mode), seen = [right];
    var all = [];
    GROUPS.forEach(function (g) { g.words.forEach(function (w) { all.push(w); }); });
    shuffleArr(all).forEach(function (w) { var a = answer(w, T.mode); if (seen.length < 4 && w[3] !== x.w[3] && seen.indexOf(a) < 0) seen.push(a); });
    return shuffleArr(seen);
  }
  function tStart(list) {
    var p = list || shuffleArr(tPool());
    if (!list && T.n) p = p.slice(0, T.n);
    if (!p.length) return;
    tq = p.map(function (x) { return { x: x, mode: T.mode, opts: T.input === 'mc' ? options(x) : null, done: false, ok: false, ans: '' }; });
    ti = 0; tShow('run'); tRender();
  }
  function tRender() {
    var q = tq[ti], w = q.x.w, m = q.mode, body;
    var ask = m === 'ru' ? 'Переведи на русский' : m === 'en' ? 'Напиши инфинитив' : 'Past Simple и Past Participle';
    if (q.opts) {
      body = q.opts.map(function (o, i) {
        var c = q.done ? (o === answer(w, m) ? ' ok' : o === q.ans ? ' no' : '') : '';
        return '<button type="button" class="t-opt' + c + '" data-opt="' + i + '"' + (q.done ? ' disabled' : '') + '>' + esc(o) + '</button>';
      }).join('');
    } else {
      var inp = function (id, ph) { return '<input class="t-in" id="' + id + '" placeholder="' + ph + '" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"' + (q.done ? ' disabled' : '') + '>'; };
      body = m === 'fm' ? inp('tA', 'Past Simple') + inp('tB', 'Past Participle') : inp('tA', m === 'ru' ? 'перевод по-русски…' : 'по-английски…');
    }
    var fb = q.done ? '<div class="t-fb ' + (q.ok ? 'ok' : 'no') + '"><b>' + (q.ok ? '✓ Верно' : '✗ Неверно') + '</b><div>' + esc(w.slice(0, 3).join(' — ')) + ' · ' + esc(w[3]) + '</div></div>' : '';
    var okN = tq.filter(function (z) { return z.ok; }).length;
    $('#tRun').innerHTML = '<div class="t-top"><span>Вопрос ' + (ti + 1) + ' / ' + tq.length + '</span><span>✅ ' + okN + '</span></div>' +
      '<div class="t-q"><span class="tag">' + esc(GROUPS[q.x.g].title) + '</span><div class="t-ask">' + ask + '</div><div class="t-big">' + esc(m === 'en' ? w[3] : w[0]) + '</div>' +
      (m === 'fm' ? '<div class="t-sub">' + esc(w[3]) + '</div>' : '') + '</div>' + body + fb + '<div class="t-act">' +
      (q.done ? '<button type="button" class="t-btn" id="tNext">' + (ti + 1 < tq.length ? 'Дальше →' : 'Результат') + '</button>'
        : (q.opts ? '' : '<button type="button" class="t-btn" id="tCheck">Проверить</button>') + '<button type="button" class="t-btn ghost" id="tSkip">Не знаю</button>') +
      '<button type="button" class="t-btn ghost" id="tStop">Завершить</button></div>';
    if (q.done) { if (!q.opts) { var p = q.ans.split(' — '); $('#tA').value = p[0] || ''; if ($('#tB')) $('#tB').value = p[1] || ''; } }
    else if ($('#tA')) $('#tA').focus({ preventScroll: true });
  }
  function tDone(ans, ok) {
    var q = tq[ti]; q.done = true; q.ans = ans; q.ok = ok;
    if (ok) errs.delete(q.x.w[0]); else errs.add(q.x.w[0]);
    lsSet(K_ERR, Array.from(errs)); tRender();
  }
  function tSubmit() {
    var q = tq[ti]; if (!q || q.done || q.opts) return;
    var a = $('#tA').value.trim(), b = $('#tB') ? $('#tB').value.trim() : '';
    if (!a) { $('#tA').focus(); return; }
    if ($('#tB') && !b) { $('#tB').focus(); return; }
    tDone($('#tB') ? a + ' — ' + b : a, check(q, a, b));
  }
  function tNext() { ti++; if (ti < tq.length) tRender(); else tFinish(); }
  function tFinish() {
    var dn = tq.filter(function (q) { return q.done; });
    if (!dn.length) { tShow('setup'); tSetup(); return; }
    var bad = dn.filter(function (q) { return !q.ok; }), pct = Math.round((dn.length - bad.length) / dn.length * 100);
    $('#tRes').innerHTML = '<div class="box t-box"><div class="t-score">' + pct + '%</div><p class="hint-line">Верно ' + (dn.length - bad.length) + ' из ' + dn.length + '</p>' +
      bad.map(function (q) { return '<div class="t-wr"><b>' + esc(q.x.w.slice(0, 3).join(' — ')) + '</b> · ' + esc(q.x.w[3]) + '<div>Твой ответ: ' + (esc(q.ans) || '—') + '</div></div>'; }).join('') +
      '<div class="t-act">' + (bad.length ? '<button type="button" class="t-btn" id="tRetry">🔁 Повторить ошибки (' + bad.length + ')</button>' : '') +
      '<button type="button" class="t-btn ghost" id="tBack">Новый тест</button></div></div>';
    tq = bad; tShow('res');
  }
  $('#t').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var d = b.dataset;
    if (d.k) { T[d.k] = d.k === 'n' ? +d.v : d.v; lsSet(K_TEST, T); tSetup(); }
    else if (d.opt !== undefined) { var q = tq[ti], o = q.opts[+d.opt]; tDone(o, o === answer(q.x.w, q.mode)); }
    else if (b.id === 'tStart') tStart();
    else if (b.id === 'tCheck') tSubmit();
    else if (b.id === 'tSkip') tDone('', false);
    else if (b.id === 'tNext') tNext();
    else if (b.id === 'tStop') tFinish();
    else if (b.id === 'tRetry') tStart(tq.map(function (z) { return z.x; }));
    else if (b.id === 'tBack') { tShow('setup'); tSetup(); }
  });
  $('#t').addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || tView !== 'run' || e.target.tagName !== 'INPUT') return;
    e.preventDefault(); tSubmit();
  });

  /* ---------- вкладки ---------- */
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('.tabs button').forEach(function (x) { x.setAttribute('aria-selected', x === b); });
      document.querySelectorAll('section.pane').forEach(function (s) { s.classList.toggle('on', s.id === b.dataset.t); });
      $('#common').hidden = b.dataset.t === 't' && tView !== 'setup';
      if (b.dataset.t === 't' && tView === 'setup') tSetup();
    };
  });
  /* смена групп пересчитывает число вопросов */
  $('#common').addEventListener('click', function () { if (tView === 'setup') tSetup(); });

  /* ---------- старт: сразу рисуем из браузера, потом подтягиваем профиль ---------- */
  status();
  rebuild();
  Promise.resolve(window.authReady).then(function () {
    status();
    if (!window.userData) return null;
    return window.userData.get(KEY);
  }).then(function (cloud) {
    if (Array.isArray(cloud) && cloud.length) {
      var a = Array.from(learned).sort().join('|'), b = cloud.slice().sort().join('|');
      if (a !== b) { learned = new Set(cloud); lsSet(KEY, cloud); rebuild(); }
    }
  }).catch(function (e) { console.error(e); });
})();
</script>
</body>
</html>
