/* Если задана ручная раскладка ov (строка из a/b) — берём её.
   Иначе каждый персонаж всегда на одной стороне (a/b):
   перебираем все разбиения персонажей на две стороны и берём то,
   где меньше всего подряд идущих реплик на одной стороне. */
function parse(t,ov){
  const L=t.split("\n").map(l=>{const i=l.indexOf(": ");return[l.slice(0,i),l.slice(i+2)]});
  if(ov)return L.map((l,i)=>[l[0],l[1],ov[i]||"a"]);
  const sp=[...new Set(L.map(l=>l[0]))];
  const side=(s,m)=>{const k=sp.indexOf(s);return k?(m>>(k-1))&1:0};
  let best=0,bc=1e9;
  for(let m=0;m<1<<(sp.length-1);m++){
    let c=0;
    for(let i=1;i<L.length;i++)if(side(L[i][0],m)==side(L[i-1][0],m))c++;
    if(c<bc){bc=c;best=m}
  }
  return L.map(l=>[l[0],l[1],side(l[0],best)?"b":"a"]);
}

/* ---------- практика: диалоги + скороговорки, общий фильтр по звуку ---------- */
let pFilt="all";
let blurred=new Set();
try{blurred=new Set(JSON.parse(localStorage.getItem("sr_blur")||"[]"))}catch(e){}
function saveBlur(){try{localStorage.setItem("sr_blur",JSON.stringify([...blurred]))}catch(e){}}
const dKey=d=>d[0].match(/\[(.*?)\]/)[1];
const tKey=t=>t[1].slice(1,-1);

/* скрытие по сторонам: ключ «номер|a» или «номер|b» */
function dlgHtml(d,i){
  const L=parse(d[1],d[2]);
  const names={a:[],b:[]};
  L.forEach(l=>{if(!names[l[2]].includes(l[0]))names[l[2]].push(l[0])});
  return `<h2 class="dlg"><i>${i+1}</i>${d[0]}</h2>`+
    `<div class="roles"><span class="rl">Скрыть роль:</span>`+
    ["a","b"].filter(s=>names[s].length).map(s=>`<button type="button" class="${s}" data-role="${s}" data-d="${i}" aria-pressed="${blurred.has(i+"|"+s)}">${s.toUpperCase()} · ${names[s].join(", ")}</button>`).join("")+`</div>`+
    L.map(l=>`<div class="row ${l[2]}${blurred.has(i+"|"+l[2])?" blur":""}" data-d="${i}"><span class="tag">${l[0]}</span><div class="bub">${l[1]}</div></div>`).join("");
}

function renderP(){
  const chips='<div class="chips" id="pchips">'+["all",...KEYS].map(k=>
    `<button aria-pressed="${k==pFilt}" data-k="${k}">${k=="all"?"Все":"["+k+"]"}</button>`).join("")+'</div>';
  const legend='<p class="legend"><span><b style="background:var(--blue)"></b>читает один</span><span><b style="background:var(--red)"></b>читает другой</span></p>'+
    '<p class="legend" style="margin-top:6px">Нажмите на A или B, чтобы скрыть реплики этой стороны. Тап по скрытой реплике — подсмотреть.</p>';
  let body="";
  KEYS.forEach(k=>{
    if(pFilt!="all"&&k!=pFilt)return;
    DL.forEach((d,i)=>{if(dKey(d)==k)body+=dlgHtml(d,i)});
    const tws=TW.map((t,i)=>[t,i]).filter(x=>tKey(x[0])==k);
    if(tws.length)body+='<h3 class="sub">Скороговорки '+(pFilt=="all"?"["+k+"]":"")+'</h3>'+
      tws.map(([t,i])=>`<div class="tw"><small>${t[1]}</small><b>${i+1}</b>${hl(t[0],t[2])}</div>`).join("");
  });
  $("#p").innerHTML=chips+legend+body;
}

$("#p").onclick=e=>{
  const kb=e.target.closest("[data-k]");
  if(kb){pFilt=kb.dataset.k;renderP();window.scrollTo(0,0);return}
  const rb=e.target.closest("[data-role]");
  if(rb){
    const key=rb.dataset.d+"|"+rb.dataset.role,on=!blurred.has(key);
    if(on)blurred.add(key);else blurred.delete(key);
    saveBlur();
    rb.setAttribute("aria-pressed",on);
    document.querySelectorAll("#p .row").forEach(r=>{
      if(r.dataset.d==rb.dataset.d&&r.classList.contains(rb.dataset.role)){r.classList.toggle("blur",on);r.classList.remove("peek")}
    });
    return;
  }
  const row=e.target.closest(".row.blur");
  if(row)row.classList.toggle("peek");
};

/* убираем слэши, скобки, точки, ударения и пробелы; ":" = "ː", латинская g = ɡ */
function normIpa(s){
  return String(s).normalize('NFC').toLowerCase()
    .replace(/:/g,'ː').replace(/g/g,'ɡ')
    .replace(/[\/\[\]\.\sˈˌ'’`]/g,'');
}

const SYMS=["iː","ɪ","e","æ","ʌ","ɑː","ɒ","ɔː","ʊ","uː","ɜː","ə","eɪ","aɪ","ɔɪ","aʊ","əʊ","ɪə","eə","ʊə","ʃ","ʒ","θ","ð","ŋ","tʃ","dʒ","ɡ","ˈ"];

$("#sym").onclick=e=>{

function resetInput(){const i=$("#tIn");i.value="";i.className="";$("#tRes").textContent="";$("#tRes").className="tres";busy=false}
$("#tForm").addEventListener("submit",e=>{
  e.preventDefault();
  if(busy||!queue.length)return;
  const inp=$("#tIn"),res=$("#tRes"),x=queue[0],top=$(".card.top");
  if(!inp.value.trim())return;
  if(top)top.classList.add("flip");
  if(normIpa(inp.value)===normIpa(x.i)){
    busy=true;inp.className="good";res.className="tres good";

  }
});

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function start(){
  const filtered=ALL.filter(x=>filt=="all"||x.s==filt);
  queue=shuffle(filtered.filter(x=>!learnedWordsSet.has(x.w)));
  total=filtered.length;
  learned=total-queue.length;
  hist=[];
  chips();
  render();
}

function mk(x,cls){const c=document.createElement("div");c.className="card "+cls;c.innerHTML=`<div class="stampR">ЗНАЮ</div><div class="stampL">ЕЩЁ РАЗ</div><div class="inner"><div class="face"><span class="badge">[${x.s}]</span><div class="word">${x.w}</div><div class="hint">напишите транскрипцию или тап — подсказка</div></div><div class="face back"><div class="ipa">${x.i}</div><div class="hint">${x.w}</div></div></div>`;return c}

function render(){
  const d=$("#deck");d.innerHTML="";
  resetInput();
  $("#tForm").style.display=queue.length?"flex":"none";
  $("#sym").style.display=queue.length?"flex":"none";
  $("#prog").style.width=(total?learned/total*100:0)+"%";
  $("#st1").textContent=`Выучено ${learned} из ${total}`;$("#st2").textContent=`Осталось ${queue.length}`;
  if(!queue.length){
    d.style.height="auto";
    d.innerHTML=`<div class="done"><h3>Все слова выучены 🎉</h3><div class="hint">${total} карточек пройдено</div><button id="again">Сбросить прогресс</button></div>`;
    $("#again").onclick=async()=>{
      learnedWordsSet.clear();
      await syncProgressWithCloud();
      start();
    };
    return;
  }
  d.style.height="300px";
  [2,1,0].forEach(n=>{if(queue[n])d.appendChild(mk(queue[n],n==0?"top":n==1?"under":"under2"))});
  bind(d.querySelector(".top"));
}

function bind(c){
  let x0=0,dx=0,drag=false,moved=false;
  const sR=c.querySelector(".stampR"),sL=c.querySelector(".stampL");
  c.onpointerdown=e=>{drag=true;moved=false;x0=e.clientX;c.setPointerCapture(e.pointerId);c.style.transition="none"};
  c.onpointermove=e=>{if(!drag)return;dx=e.clientX-x0;if(Math.abs(dx)>6)moved=true;c.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;sR.style.opacity=Math.max(0,Math.min(1,dx/90));sL.style.opacity=Math.max(0,Math.min(1,-dx/90))};
  c.onpointerup=e=>{if(!drag)return;drag=false;
  if(!moved){c.classList.toggle("flip");c.style.transform="";return}
  if(Math.abs(dx)>90)go(dx>0,c);else{c.style.transition="transform .25s";c.style.transform="";sR.style.opacity=sL.style.opacity=0}dx=0};
  c.onpointercancel=()=>{drag=false;c.style.transform=""};
}

async function go(ok,c){
  c=c||$(".card.top");if(!c||!queue.length)return;
  c.style.transition="transform .3s,opacity .3s";c.style.transform=`translateX(${ok?600:-600}px) rotate(${ok?30:-30}deg)`;c.style.opacity=0;
  const x=queue.shift();hist.push({x,ok});
  if(ok){
    learned++;
    learnedWordsSet.add(x.w);
  }else{
    queue.push(x);
  }
  busy=true;
  setTimeout(render,260);
  if(ok)syncProgressWithCloud();
}

$("#bOk").onclick=()=>{if(!busy)go(true)};
$("#bNo").onclick=()=>{if(!busy)go(false)};
$("#bUndo").onclick=()=>{
  const h=hist.pop();if(!h)return;
  if(h.ok){
    learned--;
    learnedWordsSet.delete(h.x.w);
    syncProgressWithCloud();
  }else{
    queue.pop();
  }
  queue.unshift(h.x);
  render();
};

$("#chips").onclick=e=>{const k=e.target.dataset.k;if(k){filt=k;start()}};

    `<p>According to the stability of articulation the sound [${k}] is a ${u(c[0])}.</p>`+
    `<p>According to the horizontal movement of the tongue the sound [${k}] is ${u(c[1])}.</p>`+
    `<p>According to the vertical movement of the tongue the sound [${k}] is ${u(c[2])}.</p>`+
    `<p>According to the lip position the sound [${k}] is ${u(c[3])}.</p>`+
    (c[4]?`<p>According to the length the sound [${k}] is ${u(c[4])}.</p>`:"")+`</div>`;
  }).join("");
  $("#k").innerHTML=ch+body;
}
$("#k").onclick=e=>{const k=e.target.dataset.k;if(k){kf=k;renderK();window.scrollTo(0,0)}};
renderK();

window.onload=loadProgressFromCloud;
/* после входа подтягиваем сохранённый прогресс */
document.addEventListener("auth-ready",loadProgressFromCloud);
</script>
