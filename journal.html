<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📓 Журнал — ФЛ1-ПОДб-11</title>
<link rel="stylesheet" href="theme.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script src="journals.js?v=2"></script>
<script src="app.js?v=17"></script>
<style>
.wide{width:min(1200px,calc(100% - 36px))}
.frame{position:relative;padding:0;overflow:hidden;height:calc(100dvh - var(--bar-h) - var(--nav-h) - 250px);min-height:420px}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.frame .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);font-style:italic}
.alt{position:absolute;inset:0;display:none;overflow:auto;padding:14px;text-align:center;background:var(--card)}
.alt img{display:block;max-width:none;height:auto;border:2px solid var(--line);border-radius:6px;background:#fff}
.zb{position:sticky;top:0;left:0;z-index:2;display:flex;gap:8px;width:max-content;margin:0 0 10px;padding:6px;background:var(--card);border:2px solid var(--line);border-radius:12px;box-shadow:2px 2px 0 var(--shc)}
.zb button,.zb a{min-width:40px;min-height:36px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:10px;background:var(--yel);color:#1b1f3b;font:800 14px var(--sans);text-decoration:none}
.alt .big{margin:30px 0 8px;font:italic 800 22px var(--serif)}
.alt p{color:var(--soft);font-size:14px;margin-bottom:16px}
.sub{margin:2px 0 10px;color:var(--soft);font-size:13px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.acts .btn{text-decoration:none;display:inline-flex;align-items:center}
.hint{margin-top:10px;color:var(--soft);font-size:12.5px;line-height:1.5}
</style>
</head>
<body>
<div class="container wide">
  <header class="hero">
    <span class="badge">📓 Успеваемость</span>
    <h1>Жур<span class="hl">нал</span></h1>
    <p>Выберите предмет — таблица откроется прямо здесь</p>
  </header>

  <div class="chips scroll" id="subj" role="tablist"></div>
  <div class="sub" id="full"></div>
  <div class="box frame"><div class="wait" id="wait">Загрузка таблицы…</div><iframe id="fr" title="Журнал" loading="lazy"></iframe><div class="alt" id="alt"></div></div>
  <div class="acts">
    <a class="btn ghost" id="open" target="_blank" rel="noopener">Открыть в Google Таблицах ↗</a>
  </div>
  <p class="hint" id="hint"></p>
</div>

<script>
(async function () {
  await window.authReady;
  if (window.isGuest) { location.replace('index.html'); return; }
  const all = (window.JOURNALS || []).filter(j => !j.adminOnly || window.isAdmin);
  const subj = document.getElementById('subj'), fr = document.getElementById('fr'), wait = document.getElementById('wait'),
        full = document.getElementById('full'), open = document.getElementById('open'), hint = document.getElementById('hint');
  if (!all.length) { document.querySelector('.frame').innerHTML = '<div class="wait">Журналов пока нет</div>'; return; }

  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function embedUrl(j) {
    if (j.embed) return j.embed;
    const m = /\/d\/([\w-]+)/.exec(j.url), g = /[?#&]gid=(\d+)/.exec(j.url);
    return `https://docs.google.com/spreadsheets/d/${m ? m[1] : ''}/edit?${g ? 'gid=' + g[1] + '&' : ''}rm=minimal`;
  }
  const alt = document.getElementById('alt');
  let timer;
  function showAlt(html) { alt.innerHTML = html; alt.style.display = 'block'; fr.style.display = 'none'; wait.style.display = 'none'; }
  function showImage(src, j) {
    alt.innerHTML = `<div class="zb"><button type="button" data-z="out" aria-label="Уменьшить">−</button><button type="button" data-z="in" aria-label="Увеличить">+</button><button type="button" data-z="fit">По ширине</button><button type="button" data-z="orig">1:1</button><a href="${esc(j.url)}" target="_blank" rel="noopener" aria-label="Открыть оригинал">↗</a></div><img src="${esc(src)}" referrerpolicy="no-referrer" alt="${esc(j.title)}">`;
    alt.style.display = 'block'; fr.style.display = 'none'; wait.style.display = 'none';
    const im = alt.querySelector('img');
    let w = 0;
    const apply = v => { w = Math.max(240, Math.min(v, 9000)); im.style.width = w + 'px'; };
    const fitW = () => Math.max(240, alt.clientWidth - 30);
    im.onload = () => apply(im.naturalWidth > fitW() ? im.naturalWidth : fitW());
    alt.querySelector('.zb').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      const z = b.dataset.z;
      if (z === 'in') apply(w * 1.4);
      else if (z === 'out') apply(w / 1.4);
      else if (z === 'fit') apply(fitW());
      else apply(im.naturalWidth || fitW());
    };
  }
  let pickNow = '';
  async function pick(id) {
    const j = all.find(x => x.id === id) || all[0];
    pickNow = j.id;
    try { localStorage.setItem('journal_subject', j.id); } catch (e) {}
    subj.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === j.id));
    full.textContent = j.full || j.title;
    open.href = j.url;
    open.textContent = j.type === 'image' ? 'Открыть оригинал ↗' : j.type === 'link' ? 'Открыть в новой вкладке ↗' : 'Открыть в Google Таблицах ↗';
    hint.textContent = '';
    clearTimeout(timer);
    alt.style.display = 'none'; fr.style.display = '';
    if (j.type === 'link') {
      return showAlt(`<div class="big">${esc(j.icon || '📓')} ${esc(j.title)}</div><p>Этот журнал нельзя показать внутри сайта (сервис не разрешает) — он откроется в новой вкладке.</p><a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener">Открыть журнал ↗</a>`);
    }
    if (j.type === 'image') {
      wait.style.display = 'grid'; wait.textContent = 'Загружаю картинку…';
      const tryLoad = u => new Promise(res => {
        const im = new Image();
        im.referrerPolicy = 'no-referrer';
        im.onload = () => res(u);
        im.onerror = () => res(null);
        im.src = u;
      });
      const api = 'https://cloud-api.yandex.net/v1/disk/public/resources';
      const key = encodeURIComponent(j.url);
      const cands = [];
      try {
        const r = await fetch(`${api}?public_key=${key}&preview_size=XXXL&preview_crop=false`);
        const d = await r.json();
        const order = ['ORIGINAL', 'XXXL', 'XXL', 'XL', 'L', 'M'];
        if (d.sizes) order.forEach(n => { const s = d.sizes.find(x => x.name === n); if (s && s.url) cands.push(s.url); });
        if (d.file) cands.push(d.file);
      } catch (e) {}
      try {
        const r = await fetch(`${api}/download?public_key=${key}`);
        const d = await r.json();
        if (d.href) cands.push(d.href);
      } catch (e) {}
      /* последний шанс — то, что отдаёт сервис как превью (может быть мелким) */
      try {
        const r = await fetch(`${api}?public_key=${key}`);
        const d = await r.json();
        if (d.preview) cands.push(d.preview);
      } catch (e) {}
      let ok = null;
      for (const u of cands) { ok = await tryLoad(u); if (ok) break; }
      if (pickNow !== j.id) return;
      if (ok) return showImage(ok, j);
      return showAlt(`<div class="big">${esc(j.icon || '📓')} ${esc(j.title)}</div><p>Яндекс.Диск не отдаёт картинку для показа на сайте — она откроется в новой вкладке.</p><a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener">Открыть картинку ↗</a>`);
    }
    wait.style.display = 'grid'; wait.textContent = 'Загрузка таблицы…';
    fr.onload = () => { wait.style.display = 'none'; clearTimeout(timer); };
    fr.src = embedUrl(j);
    timer = setTimeout(() => {
      hint.textContent = 'Если таблица не появилась — откройте её кнопкой выше. Для встроенного вида таблица должна быть открыта «всем, у кого есть ссылка».';
    }, 8000);
  }
  subj.innerHTML = all.map(j => `<button type="button" role="tab" data-id="${esc(j.id)}">${esc(j.icon || '📓')} ${esc(j.title)}</button>`).join('');
  subj.onclick = e => { const b = e.target.closest('button'); if (b) { history.replaceState(null, '', '#' + b.dataset.id); pick(b.dataset.id); } };
  let start = location.hash.slice(1);
  try { start = start || localStorage.getItem('journal_subject') || ''; } catch (e) {}
  pick(start);
})();
</script>
</body>
</html>
