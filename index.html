<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script src="app.js"></script>
<title>ФЛ1-ПОДб-11 — Главная</title>
<style>
:root{--paper:#fbf7ec;--grid:#d5e3f3;--ink:#1b1f3b;--soft:#5b6078;--card:#fff;--blue:#2563eb;--red:#ee2b45;--yel:#ffd84d;--line:#1b1f3b;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15172b;--grid:#23274a;--ink:#f1efe6;--soft:#9ca0bd;--card:#1f2340;--line:#f1efe6}}
:root[data-theme="dark"]{--paper:#15172b;--grid:#23274a;--ink:#f1efe6;--soft:#9ca0bd;--card:#1f2340;--line:#f1efe6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:15px/1.45 system-ui,-apple-system,sans-serif;min-height:100vh;margin:0;padding:20px 16px}
main{max-width:480px;margin:40px auto;background:var(--card);border:2.5px solid var(--line);border-radius:20px;padding:24px;box-shadow:4px 4px 0 var(--line)}
h1{font:italic 800 32px Georgia,serif;margin:0 0 8px;text-align:center}
p.sub{color:var(--soft);text-align:center;margin:0 0 20px;font-size:14px}
.field{margin-bottom:14px}
label{display:block;font-weight:700;margin-bottom:6px;font-size:13px}
input, select{width:100%;padding:11px;border:2px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-weight:600;font-size:15px}
button{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--yel);color:#1b1f3b;font-weight:800;font-size:16px;box-shadow:3px 3px 0 var(--line);cursor:pointer;margin-top:10px}
#user-status{display:none;text-align:center;padding:10px;background:rgba(37,99,235,0.1);border-radius:10px;margin-bottom:16px;font-weight:700}
</style>
</head>
<body>

<main>
  <h1>ФЛ1-ПОДб-11</h1>
  <p class="sub">Портал учебной группы</p>

  <div id="user-status"></div>

  <form id="loginForm">
    <div class="field">
      <label for="loginInput">Логин / Выбор пользователя:</label>
      <input type="text" id="loginInput" placeholder="Введите логин (напр. aaa112461)" required>
    </div>
    <div class="field">
      <label for="passInput">Пароль:</label>
      <input type="password" id="passInput" placeholder="Введите пароль" required>
    </div>
    <button type="submit" id="submitBtn">Войти в аккаунт</button>
  </form>

  <button id="logoutBtn" style="display:none;background:var(--red);color:#fff;">Выйти из аккаунта</button>
</main>

<script>
async function checkAuth() {
  if (!window.supabaseClient) return;
  const { data: { user } } = await window.supabaseClient.auth.getUser();
  const form = document.getElementById('loginForm');
  const status = document.getElementById('user-status');
  const logoutBtn = document.getElementById('logoutBtn');

  if (user) {
    form.style.display = 'none';
    status.style.display = 'block';
    status.textContent = `👤 Авторизован: ${user.user_metadata?.login || user.email}`;
    logoutBtn.style.display = 'block';
  } else {
    form.style.display = 'block';
    status.style.display = 'none';
    logoutBtn.style.display = 'none';
  }
}

document.getElementById('loginForm').onsubmit = async (e) => {
  e.preventDefault();
  const login = document.getElementById('loginInput').value.trim();
  const password = document.getElementById('passInput').value.trim();
  const btn = document.getElementById('submitBtn');

  btn.textContent = 'Вход...';
  btn.disabled = true;

  const email = login.includes('@') ? login : `${login}@podb.ru`;
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    alert('Ошибка входа: ' + error.message);
    btn.textContent = 'Войти в аккаунт';
    btn.disabled = false;
  } else {
    await checkAuth();
  }
};

document.getElementById('logoutBtn').onclick = async () => {
  await supabaseClient.auth.signOut();
  location.reload();
};

document.addEventListener('DOMContentLoaded', checkAuth);
</script>
</body>
</html>
