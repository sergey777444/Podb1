<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🛠 Админка — ФЛ1-ПОДб-11</title>
<link rel="stylesheet" href="theme.css?v=2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.js"></script>
<script src="app.js?v=18"></script>
<style>
.container,.container *{min-width:0}
.tools{position:sticky;top:calc(var(--bar-h) + 4px);z-index:50;margin-bottom:14px;padding:8px;background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.tools .row{display:flex;gap:8px;align-items:center}
.tools .row .form-control{flex:1 1 auto;width:auto;min-width:0;padding:9px 12px}
.tools .row .btn{flex:none;padding:9px 12px;white-space:nowrap;min-height:40px}
.cnt{margin-top:6px;color:var(--soft);font-size:12px;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.sech{display:flex;align-items:center;gap:8px;margin:22px 0 10px;font:italic 800 19px var(--serif)}
.sech small{margin-left:auto;font:700 12px var(--sans);font-style:normal;color:var(--soft)}
.sech .dot{min-width:24px;height:24px;padding:0 7px;display:inline-grid;place-items:center;border:2px solid var(--line);border-radius:99px;background:var(--red);color:#fff;font:800 12px var(--sans);font-style:normal}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.acc{min-width:0;overflow:hidden;padding:12px;background:var(--card);border:2px solid var(--line);border-top:10px solid var(--violet);border-radius:var(--r);box-shadow:var(--sh)}
.acc.adm{border-top-color:var(--red)}
.acc.pend{border-top-color:var(--yel)}
.acc.okk{border-top-color:var(--green)}
.head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.head .av{flex:none}
.who{min-width:0;flex:1}
.nick{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:italic 800 17px var(--serif)}
.fio{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--soft);font-size:12.5px}
.role{display:inline-block;margin-left:6px;padding:1px 7px;border:2px solid var(--line);border-radius:6px;background:var(--red);color:#fff;font:800 10px var(--sans);text-transform:uppercase;font-style:normal;vertical-align:middle}
.role.w{background:var(--yel);color:#1b1f3b}
.role.g{background:var(--green);color:#fff}
.role.n{background:var(--soft);color:#fff}
.acts{flex-wrap:wrap}
.kv{display:flex;align-items:center;gap:6px;margin-top:8px;padding:5px 5px 5px 10px;border:2px solid var(--line);border-radius:12px;background:var(--bg);min-width:0}
.kv small{flex:0 0 52px;color:var(--soft);font:800 10px var(--sans);letter-spacing:.04em;text-transform:uppercase}
.kv code{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:700 15px ui-monospace,Menlo,monospace}
.kv button{flex:none;width:36px;height:36px;border:2px solid var(--line);border-radius:10px;background:var(--card);font-size:15px;box-shadow:2px 2px 0 var(--shc)}
.kv button:active{transform:translate(2px,2px);box-shadow:none}
.nopass{color:var(--soft);font-style:italic;font-size:13px}
.acts{display:flex;gap:8px;margin-top:10px}
.acts button{flex:1;min-height:40px;padding:8px 10px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:800 13px var(--sans);box-shadow:2px 2px 0 var(--shc)}
.acts button:active{transform:translate(2px,2px);box-shadow:none}
.acts button:disabled{opacity:.5}
.acts .v{background:var(--green);color:#fff}
.acts .d{flex:0 0 auto;background:var(--red);color:#fff}
.msg{padding:14px;border:2px dashed var(--red);border-radius:var(--r);background:var(--no-bg);font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 12px);transform:translateX(-50%);z-index:100002;padding:8px 16px;border:2px solid var(--line);border-radius:99px;background:var(--yel);color:#1b1f3b;font:800 13px var(--sans);box-shadow:3px 3px 0 var(--shc);opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.on{opacity:1}
@media(max-width:520px){
  .hero{padding:18px 14px}
  .cnt{font-size:11px}
}
</style>
</head>
<body>
<div class="container">
  <header class="hero">
    <span class="badge">🛠 Только для админов</span>
    <h1>Акка<span class="hl">унты</span></h1>
    <p>Новые регистрации, подтверждение, логины и пароли</p>
  </header>

  <section class="tools">
    <div class="row">
      <input id="q" class="form-control" type="search" placeholder="Поиск: ФИО, ник, логин" autocomplete="off">
      <button class="btn ghost" id="copyAll" type="button">📋 Всё</button>
    </div>
    <div class="cnt" id="cnt"></div>
  </section>

  <div id="out"><div class="empty">Загрузка…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
(async function () {
  const out = document.getElementById('out'), q = document.getElementById('q'), cnt = document.getElementById('cnt'), toast = document.getElementById('toast');
  const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  let tt;
  const say = t => { toast.textContent = t; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 1800); };
  const copy = async text => {
    try { await navigator.clipboard.writeText(text); say('Скопировано'); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); say('Скопировано'); } catch (e2) { say('Не удалось скопировать'); }
      ta.remove();
    }
  };

  await window.authReady;
  if (window.isGuest || !window.isAdmin) { location.replace('index.html'); return; }

  const [pr, pw, ud] = await Promise.all([
    sb.from('profiles').select('id,login,full_name,role,verified,reviewed'),
    sb.from('student_passwords').select('login,password'),
    sb.from('user_data').select('user_id,value').eq('key', 'profile')
  ]);
  if (pr.error) {
    out.innerHTML = '<div class="msg"><b>Не удалось загрузить список.</b><br>Выполните <code>auth-setup.sql</code> в Supabase (SQL Editor): там поле <code>verified</code> и политики доступа для админов.<br><small>' + esc(pr.error.message) + '</small></div>';
    return;
  }
  const pass = {}; (pw.data || []).forEach(r => (pass[r.login] = r.password));
  const prof = {}; (ud.data || []).forEach(r => (prof[r.user_id] = r.value || {}));
  const hasPass = !pw.error;

  let people = (pr.data || []).map(p => ({
    id: p.id, login: p.login, name: p.full_name || '', role: p.role, verified: p.role === 'admin' || p.verified === true, reviewed: p.role === 'admin' || p.verified === true || p.reviewed === true,
    pr: prof[p.id] || {}, pass: pass[p.login]
  }));
  const byName = (a, b) => (a.name || a.login).localeCompare(b.name || b.login, 'ru');

  const show = {};
  function card(p) {
    const nick = p.pr.nick || '';
    const title = nick || p.name || p.login;
    const sub = nick ? p.name : (p.name && p.name !== title ? p.name : '');
    const adm = p.role === 'admin';
    const guest = !adm && !p.verified && p.reviewed;
    const cls = adm ? ' adm' : p.verified ? ' okk' : guest ? '' : ' pend';
    const badge = adm ? '<i class="role">админ</i>' : p.verified ? '<i class="role g">✓</i>' : guest ? '<i class="role n">гость</i>' : '<i class="role w">ждёт</i>';
    const acts = adm ? '' : `<div class="acts">
      ${p.verified
        ? '<button type="button" data-a="unv">↩ Сделать гостем</button>'
        : `<button type="button" class="v" data-a="ver">✅ Подтвердить</button>${guest ? '' : '<button type="button" data-a="gst">🚫 Не верифицировать</button>'}`}
      <button type="button" class="d" data-a="del" aria-label="Удалить аккаунт">🗑</button></div>`;
    return `<article class="acc${cls}" data-l="${esc(p.login)}">
      <div class="head">${window.avatarHtml(p.pr, 48, (title || '?').charAt(0).toUpperCase())}
        <div class="who"><div class="nick">${esc(title)}${badge}</div><div class="fio">${esc(sub || (nick ? '' : 'без никнейма'))}</div></div></div>
      <div class="kv"><small>Логин</small><code>${esc(p.login)}</code><button type="button" data-a="cl" aria-label="Копировать логин">📋</button></div>
      <div class="kv"><small>Пароль</small>${p.pass
        ? `<code>${show[p.login] ? esc(p.pass) : '••••••••••'}</code><button type="button" data-a="eye" aria-label="Показать пароль">${show[p.login] ? '🙈' : '👁'}</button><button type="button" data-a="cp" aria-label="Копировать пароль">📋</button>`
        : `<span class="nopass">${hasPass ? 'нет в списке' : 'таблица паролей не создана'}</span>`}</div>
      ${acts}
    </article>`;
  }
  function section(title, list, dot) {
    if (!list.length) return '';
    return `<div class="sech">${esc(title)}${dot ? `<span class="dot">${list.length}</span>` : `<small>${list.length}</small>`}</div><div class="list">${list.map(card).join('')}</div>`;
  }
  function render() {
    const s = q.value.trim().toLowerCase();
    const list = people.filter(p => !s || (p.name + ' ' + (p.pr.nick || '') + ' ' + p.login).toLowerCase().includes(s));
    const pend = list.filter(p => p.role !== 'admin' && !p.verified && !p.reviewed).sort(byName);
    const gst = list.filter(p => p.role !== 'admin' && !p.verified && p.reviewed).sort(byName);
    const ok = list.filter(p => p.role !== 'admin' && p.verified).sort(byName);
    const adm = list.filter(p => p.role === 'admin').sort(byName);
    out.innerHTML = list.length
      ? section('⏳ Ожидают подтверждения', pend, true) + section('✅ Подтверждённые', ok) + section('👤 Гости (не верифицированы)', gst) + section('🛠 Админы', adm)
      : '<div class="empty">Никого не найдено</div>';
    const all = people.filter(p => p.role !== 'admin');
    const nicks = people.filter(p => p.pr.nick).length;
    cnt.textContent = `Ждут: ${all.filter(p => !p.verified && !p.reviewed).length} · гостей: ${all.filter(p => !p.verified && p.reviewed).length} · подтверждено: ${all.filter(p => p.verified).length} · админов: ${people.length - all.length} · с ником: ${nicks}`;
  }

  async function setVerified(p, v, btn) {
    btn.disabled = true;
    const { error } = await sb.rpc('set_verified', { uid: p.id, v });
    if (error) { console.error(error); btn.disabled = false; say('Ошибка: ' + error.message); return; }
    p.verified = v; p.reviewed = true;
    say(v ? 'Подтверждено ✅' : 'Теперь гость');
    render();
  }
  async function setGuest(p, btn) {
    btn.disabled = true;
    const { error } = await sb.rpc('set_reviewed', { uid: p.id, r: true });
    if (error) { console.error(error); btn.disabled = false; say('Ошибка: ' + error.message); return; }
    p.reviewed = true;
    say('Оставлен гостем');
    render();
  }
  async function removeUser(p, btn) {
    if (!confirm(`Удалить аккаунт «${p.name || p.login}» (${p.login}) вместе со всеми данными? Это нельзя отменить.`)) return;
    btn.disabled = true;
    const { error } = await sb.rpc('admin_delete_user', { uid: p.id });
    if (error) { console.error(error); btn.disabled = false; say('Ошибка: ' + error.message); return; }
    people = people.filter(x => x.id !== p.id);
    say('Аккаунт удалён');
    render();
  }

  q.oninput = render;
  out.addEventListener('click', e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const l = b.closest('.acc').dataset.l, p = people.find(x => x.login === l);
    if (!p) return;
    const a = b.dataset.a;
    if (a === 'cl') copy(p.login);
    else if (a === 'cp') copy(p.pass);
    else if (a === 'eye') { show[l] = !show[l]; render(); }
    else if (a === 'ver') setVerified(p, true, b);
    else if (a === 'unv') setVerified(p, false, b);
    else if (a === 'gst') setGuest(p, b);
    else if (a === 'del') removeUser(p, b);
  });
  document.getElementById('copyAll').onclick = () =>
    copy(people.filter(p => p.role !== 'admin' && p.verified).map(p => `${p.name}\t${p.login}\t${p.pass || ''}`).join('\n'));
  render();
})();
</script>
</body>
</html>
